<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1115" />
    <meta name="description" content="生年月日から算命学・四柱推命・西洋＆インド占星術を自前計算。毎日の運氣・占術カレンダー・AI相談。" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="命式ノート" />
    <title>命式ノート — 算命学・四柱推命・占星術</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #0F1115; color: #E8EAED; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-text-size-adjust: 100%; line-height: 1.7; font-size: 16px; }
      * { box-sizing: border-box; }
      button { -webkit-tap-highlight-color: transparent; }
      #root:empty::after { content: "読み込み中…"; display: grid; place-items: center; height: 100%; color: #9AA1AC; font-size: 14px; }
      input, select, button { font-family: inherit; }
      /* マイクロインタラクション：押下の手応え＋スレッドの出現アニメ（TimeTree風の心地よさ） */
      .tap { transition: transform .08s ease, opacity .12s ease; }
      .tap:active { transform: scale(.95); }
      @keyframes tt-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
      .tt-in { animation: tt-in .28s ease both; }
      @media (prefers-reduced-motion: reduce) { .tap, .tt-in { transition: none; animation: none; } }
    </style>
    <script>
      // 起動エラーを画面に出す（白画面防止）
      window.addEventListener("error", function (e) {
        var r = document.getElementById("root");
        if (!r || r.childElementCount > 0) return;
        var msg = (e.error && e.error.stack) || e.message || "読み込みエラー";
        if (/extension:\/\//.test(String(msg))) return;
        r.innerHTML = "<div style='padding:20px;font-size:13px;color:#9AA1AC'><b style='color:#E2554B'>読み込みの問題</b><pre style='white-space:pre-wrap;background:#171A21;padding:12px;border-radius:8px'>" + String(msg) + "</pre>（初回はネット接続が必要です。esm.sh から React と計算ライブラリを読み込みます。一度開けば次回からオフラインでも起動します）</div>";
      }, true);
      // PWA: Service Worker を登録（オフライン起動・ホーム画面追加用）。相対パスで配信先サブパスに追従。
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { useState, useMemo, useEffect } from "https://esm.sh/react@18.3.1";
      import { createRoot } from "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1";
      import htm from "https://esm.sh/htm@3.1.1";
      import {
        sanmeiDetail, sanmeiUn, tenchusatsu, daiun, aishou, computeChart, advisor, stancesFor, bodyLongitudes,
      } from "./natal.js";

      const html = htm.bind(React.createElement);

      // 配色テーマ（ダーク/ライト）。onAccent = 色付きボタン上の文字色。
      const THEMES = {
        dark: {
          bg: "#0F1115", panel: "#171A21", panel2: "#1E222B", line: "#2A2F3A",
          text: "#E8EAED", sub: "#B4BBC6", faint: "#A6ADB8",
          purple: "#9B8CFF", green: "#3FB984", blue: "#5B8DEF", accent: "#C9A227", red: "#E2554B",
          onAccent: "#0B0D11",
        },
        light: {
          bg: "#F4F6F9", panel: "#FFFFFF", panel2: "#EEF1F5", line: "#D7DCE3",
          text: "#1B1F26", sub: "#414956", faint: "#586071",
          purple: "#6C5CE7", green: "#1E9E6A", blue: "#2F6FE0", accent: "#B8860B", red: "#D23B30",
          onAccent: "#FFFFFF",
        },
      };
      const THEME_STORE = "meishiki-note:theme";
      const loadTheme = () => { try { return localStorage.getItem(THEME_STORE) === "light" ? "light" : "dark"; } catch { return "dark"; } };
      // C / inp / card は let（ライブバインディング）。テーマ変更時に作り直して全体に反映。
      let C = THEMES[loadTheme()] || THEMES.dark;
      let inp, card;
      const rebuildStyles = () => {
        inp = { width: "100%", padding: "12px 14px", marginBottom: 10, background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 11, color: C.text, fontSize: 16 };
        card = { background: C.panel, border: `1px solid ${C.line}`, borderRadius: 16, padding: 18, marginBottom: 16 };
      };
      const applyBodyTheme = () => { try { document.body.style.background = C.bg; document.body.style.color = C.text; } catch {} };
      const applyTheme = (mode) => {
        C = THEMES[mode] || THEMES.dark;
        rebuildStyles(); applyBodyTheme();
        try { localStorage.setItem(THEME_STORE, mode); } catch {}
      };
      rebuildStyles(); applyBodyTheme();

      // 出生地（47都道府県の県庁所在地・緯度経度）。真太陽時の地方時補正に使用。
      const PLACES = [
        ["北海道", 43.06, 141.35], ["青森", 40.82, 140.74], ["岩手", 39.70, 141.15],
        ["宮城", 38.27, 140.87], ["秋田", 39.72, 140.10], ["山形", 38.24, 140.36],
        ["福島", 37.75, 140.47], ["茨城", 36.34, 140.45], ["栃木", 36.57, 139.88],
        ["群馬", 36.39, 139.06], ["埼玉", 35.86, 139.65], ["千葉", 35.61, 140.12],
        ["東京", 35.69, 139.69], ["神奈川", 35.45, 139.64], ["新潟", 37.90, 139.02],
        ["富山", 36.70, 137.21], ["石川", 36.59, 136.63], ["福井", 36.07, 136.22],
        ["山梨", 35.66, 138.57], ["長野", 36.65, 138.18], ["岐阜", 35.39, 136.72],
        ["静岡", 34.98, 138.38], ["愛知", 35.18, 136.91], ["三重", 34.73, 136.51],
        ["滋賀", 35.00, 135.87], ["京都", 35.02, 135.76], ["大阪", 34.69, 135.50],
        ["兵庫", 34.69, 135.20], ["奈良", 34.69, 135.83], ["和歌山", 34.23, 135.17],
        ["鳥取", 35.50, 134.24], ["島根", 35.47, 133.05], ["岡山", 34.66, 133.93],
        ["広島", 34.40, 132.46], ["山口", 34.19, 131.47], ["徳島", 34.07, 134.56],
        ["香川", 34.34, 134.05], ["愛媛", 33.84, 132.77], ["高知", 33.56, 133.53],
        ["福岡", 33.61, 130.42], ["佐賀", 33.25, 130.30], ["長崎", 32.74, 129.87],
        ["熊本", 32.79, 130.74], ["大分", 33.24, 131.61], ["宮崎", 31.91, 131.42],
        ["鹿児島", 31.56, 130.56], ["沖縄", 26.21, 127.68],
      ];

      // 入力（生年月日など）は端末内の localStorage にのみ保存。外部送信はしない。
      // v2: 複数プロフィールをリストで保持し、名前で切り替えられる。
      const STORE_KEY = "meishiki-note:v2";
      const DEFAULT_FORM = { name: "", date: "", time: "", gender: "", place: "東京", memo: "" };
      const newId = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const labelOf = (p) => (p && (p.name || p.date)) || "無題";
      const loadStore = () => {
        try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if (s && Array.isArray(s.profiles)) return s; } catch {}
        // 旧 v1（単一保存）からの移行
        try { const v1 = JSON.parse(localStorage.getItem("meishiki-note:v1") || "null"); if (v1 && v1.date) { const id = newId(); return { profiles: [{ id, ...DEFAULT_FORM, ...v1 }], currentId: id }; } } catch {}
        return { profiles: [], currentId: null };
      };
      const saveStore = (s) => { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch {} };
      // この端末/ブラウザで localStorage が実際に使えるか（プライベートブラウズ等の検出）
      const STORAGE_OK = (() => {
        try { const k = "__meishiki_test"; localStorage.setItem(k, "1"); const v = localStorage.getItem(k); localStorage.removeItem(k); return v === "1"; } catch { return false; }
      })();
      // フォーム入力から鑑定用の birth オブジェクトを組み立てる（出生地→緯度経度を解決）。
      const buildBirth = (f) => {
        if (!f || !f.date) return null;
        const p = PLACES.find((x) => x[0] === f.place) || PLACES[0];
        return { name: (f.name || "").trim(), date: f.date, time: f.time || "12:00", timeKnown: !!f.time, gender: f.gender || "", place: f.place || PLACES[0][0], lat: p[1], lon: p[2], utcOffset: 9, memo: (f.memo || "").trim() };
      };

      // ── AI占い師チャット（自分専用・ブラウザから Google Gemini を直接呼ぶ）──
      // APIキーはこの端末の localStorage にのみ保存。相談時のみ命式と相談文を Gemini に送信する。
      const KEY_STORE = "meishiki-note:gemini-key";
      const loadKey = () => { try { return localStorage.getItem(KEY_STORE) || ""; } catch { return ""; } };
      const saveKey = (k) => { try { localStorage.setItem(KEY_STORE, k); } catch {} };
      const clearKey = () => { try { localStorage.removeItem(KEY_STORE); } catch {} };

      // ── 課金（年額サブスク・7日トライアル）＆ コホート計測（S1：観測の土台）──
      // すべて空＝OFF（＝全機能開放・現状のまま）。Stripe等を設定した瞬間に有効化される。
      const BILLING = {
        mode: "mosh",    // "mosh"（会員コード方式）／ "stripe"（client_reference_idで自動判定）
        checkoutUrl: "", // MOSH：月額/年額サブスクのページURL（Stripe：Payment Link）
        portalUrl: "",   // 解約・購読管理ページ（MOSHのマイページ等）のURL
        api: "",         // worker.js のベースURL。空なら計測ローカルのみ＆全機能開放（現状維持）。
        ctaLabel: "",    // 購読ボタンの文言（空なら自動）
        trialDays: 0,    // 無料体験日数（MOSH側で設定した場合の表示用。0なら非表示）
      };
      const _apiBase = () => (BILLING.api || "").replace(/\/$/, "");
      const INSTALL_STORE = "meishiki-note:install";
      const getInstallId = () => {
        try { let id = localStorage.getItem(INSTALL_STORE); if (!id) { id = "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); localStorage.setItem(INSTALL_STORE, id); } return id; } catch { return "anon"; }
      };
      const checkoutHref = () => { const u = BILLING.checkoutUrl; if (!u) return "#"; if (BILLING.mode === "stripe") return u + (u.includes("?") ? "&" : "?") + "client_reference_id=" + encodeURIComponent(getInstallId()); return u; };
      // コホート計測：イベントをAPIへ送信（任意）＋ローカルにも残す（バックエンド前でも検証可能）
      const track = (name) => {
        try { const b = _apiBase(); if (b) { const body = JSON.stringify({ id: getInstallId(), name, t: Date.now() }); if (navigator.sendBeacon) navigator.sendBeacon(b + "/event", body); else fetch(b + "/event", { method: "POST", body, keepalive: true }).catch(() => {}); } } catch {}
        try { const k = "meishiki-note:events"; const a = JSON.parse(localStorage.getItem(k) || "[]"); a.push({ name, t: Date.now() }); localStorage.setItem(k, JSON.stringify(a.slice(-300))); } catch {}
      };
      // 触覚フィードバック（対応端末＝主にAndroid。iOS Safariは非対応のため視覚アニメで代替）
      const haptic = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch {} };
      const ENT_STORE = "meishiki-note:entitlement";
      const loadEnt = () => { try { return JSON.parse(localStorage.getItem(ENT_STORE) || "null"); } catch { return null; } };
      const saveEnt = (e) => { try { localStorage.setItem(ENT_STORE, JSON.stringify(e)); } catch {} };
      // 権利確認：サーバに購読状態を問い合わせ。OFF時は常に active 扱い（＝現状維持で全機能開放）。
      const verifyEntitlement = async () => {
        if (!BILLING.api) return { active: true, status: "open" };
        const id = getInstallId();
        try {
          const r = await fetch(_apiBase() + "/entitlement?id=" + encodeURIComponent(id), { cache: "no-store" });
          const d = await r.json();
          const prev = loadEnt();
          const e = { active: !!d.active, status: d.status || "", until: d.currentPeriodEnd || 0, checkedAt: Date.now() };
          saveEnt(e);
          if (e.active && !(prev && prev.active)) track("activated");
          return e;
        } catch { return loadEnt() || { active: false, status: "unknown" }; }
      };
      // 会員コードで解除（MOSHで購読後に届くコードを入力）
      const redeemCode = async (code) => {
        if (!BILLING.api) return { active: true };
        try {
          const r = await fetch(_apiBase() + "/redeem", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: getInstallId(), code: String(code || "").trim() }) });
          const d = await r.json();
          if (d && d.active) { const e = { active: true, status: d.status || "member", checkedAt: Date.now() }; saveEnt(e); return e; }
          return d || { active: false };
        } catch { return { active: false, error: "network" }; }
      };

      // ── 連続来訪ストリーク（毎日開く動機づけ・習慣化）──
      const VISIT_STORE = "meishiki-note:visit:v1";
      const ymd = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
      const loadVisit = () => { try { return JSON.parse(localStorage.getItem(VISIT_STORE) || "null") || {}; } catch { return {}; } };
      // 来訪を記録し、ストリーク情報 { streak, best, days, last } を返す（1日1回だけ加算）
      const touchVisit = () => {
        const today = ymd(new Date());
        const yest = ymd(new Date(Date.now() - 86400000));
        const v = loadVisit();
        if (v.last !== today) {
          v.streak = v.last === yest ? (v.streak || 0) + 1 : 1;
          v.days = (v.days || 0) + 1;
          v.last = today;
        }
        v.streak = v.streak || 1;
        v.best = Math.max(v.best || 0, v.streak);
        try { localStorage.setItem(VISIT_STORE, JSON.stringify(v)); } catch {}
        return v;
      };

      // ── 共有（再来訪・口コミ導線）。Web Share→無ければクリップボード。──
      const shareApp = async (text) => {
        const url = location.href;
        try { if (navigator.share) { await navigator.share({ title: "命式ノート", text, url }); return "shared"; } } catch (e) { if (String(e && e.name) === "AbortError") return "shared"; }
        try { await navigator.clipboard.writeText(`${text}\n${url}`); return "copied"; } catch {}
        return "fail";
      };
      const copyUrl = async () => { try { await navigator.clipboard.writeText(location.href); return true; } catch { return false; } };
      // スタンドアロン（ホーム画面から起動）判定
      const isStandalone = () => {
        try { return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true; } catch { return false; }
      };
      const isIOS = () => { try { return /iphone|ipad|ipod/i.test(navigator.userAgent); } catch { return false; } };

      // ── 日々の記録（気分ログ）：データ蓄積でスイッチングコストを生み継続を強める ──
      const JOURNAL_STORE = "meishiki-note:journal:v1";
      const loadJournal = () => { try { return JSON.parse(localStorage.getItem(JOURNAL_STORE) || "{}") || {}; } catch { return {}; } };
      const getEntry = (iso) => loadJournal()[iso] || null;
      const saveEntry = (iso, entry) => {
        const j = loadJournal();
        if (entry && (entry.mood || (entry.note || "").trim())) j[iso] = { mood: entry.mood || 0, note: (entry.note || "").trim() };
        else delete j[iso];
        try { localStorage.setItem(JOURNAL_STORE, JSON.stringify(j)); } catch {}
        return j;
      };
      const journalCount = () => Object.keys(loadJournal()).length;
      const MOODS = [[1, "😣"], [2, "😕"], [3, "😐"], [4, "🙂"], [5, "😄"]];
      const moodEmoji = (m) => { const f = MOODS.find((x) => x[0] === m); return f ? f[1] : ""; };

      // ── バックアップ（書き出し/読み込み）：localStorage全滅（端末変更・履歴削除）への保険 ──
      const BACKUP_PREFIX = "meishiki-note:";
      const exportBackup = () => {
        try {
          const data = {};
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith(BACKUP_PREFIX)) data[k] = localStorage.getItem(k);
          }
          const blob = new Blob([JSON.stringify({ app: "meishiki-note", version: 1, exportedAt: new Date().toISOString(), data }, null, 2)], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `命式ノート_バックアップ_${ymd(new Date())}.json`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        } catch (e) { alert("書き出しに失敗しました：" + e.message); }
      };
      const importBackup = (file) => {
        if (!file) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const o = JSON.parse(String(r.result || ""));
            if (!o || o.app !== "meishiki-note" || !o.data) { alert("命式ノートのバックアップファイルではないようです"); return; }
            const n = Object.keys(o.data).length;
            if (!confirm(`バックアップ（${n}項目）を読み込みます。現在のデータは上書きされます。よろしいですか？`)) return;
            Object.entries(o.data).forEach(([k, v]) => { if (k.startsWith(BACKUP_PREFIX) && typeof v === "string") localStorage.setItem(k, v); });
            alert("読み込みました。画面を更新します。");
            location.reload();
          } catch (e) { alert("読み込みに失敗しました：" + e.message); }
        };
        r.readAsText(file);
      };

      // ── 週次コーチング（運勢に基づく問い→宣言→達成。行動変容を促す）──
      const COACH_STORE = "meishiki-note:coach:v1";
      const mondayKey = () => { const d = new Date(); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return ymd(d); };
      const loadCoach = () => { try { return JSON.parse(localStorage.getItem(COACH_STORE) || "{}") || {}; } catch { return {}; } };
      const saveCoach = (o) => { try { localStorage.setItem(COACH_STORE, JSON.stringify(o)); } catch {} };

      // ── ストリークのマイルストーン（損失回避＋達成感で継続を後押し）──
      const MILESTONE_STORE = "meishiki-note:milestone:v1";
      const MILESTONES = [3, 7, 14, 30, 50, 100, 200, 365];
      const checkMilestone = (streak) => {
        const reached = MILESTONES.filter((n) => streak >= n).pop() || 0;
        let last = 0; try { last = parseInt(localStorage.getItem(MILESTONE_STORE) || "0", 10) || 0; } catch {}
        if (reached > last) { try { localStorage.setItem(MILESTONE_STORE, String(reached)); } catch {} return reached; }
        return 0;
      };

      // ── 今日のラッキー（五行ベースの日替わりコンテンツ：新鮮さ＝戻る理由）──
      const STEM_ELEM = { 甲: "木", 乙: "木", 丙: "火", 丁: "火", 戊: "土", 己: "土", 庚: "金", 辛: "金", 壬: "水", 癸: "水" };
      const LUCKY_BY_ELEM = {
        木: { color: "緑", hex: "#36B37E", dir: "東", action: "新しいことを始める・企画する" },
        火: { color: "赤・オレンジ", hex: "#E2554B", dir: "南", action: "発信する・人と会う・表現する" },
        土: { color: "黄・ベージュ", hex: "#C9A227", dir: "南西", action: "整理する・信頼を積む・基盤づくり" },
        金: { color: "白・金", hex: "#C9CDD6", dir: "西", action: "決断する・仕上げる・手放す" },
        水: { color: "青・黒", hex: "#5B8DEF", dir: "北", action: "学ぶ・情報収集・休んで充電" },
      };
      const BRANCH_TIME = { 子: "23〜1時", 丑: "1〜3時", 寅: "3〜5時", 卯: "5〜7時", 辰: "7〜9時", 巳: "9〜11時", 午: "11〜13時", 未: "13〜15時", 申: "15〜17時", 酉: "17〜19時", 戌: "19〜21時", 亥: "21〜23時" };
      const luckyOf = (un) => {
        if (!un || !un.day) return null;
        const elem = STEM_ELEM[un.day.stem] || "土";
        const branch = String(un.day.ganzhi || "").slice(-1);
        return { ...LUCKY_BY_ELEM[elem], elem, time: BRANCH_TIME[branch] || "—" };
      };

      // ── 「今日の小さな一歩」：日付＋本人で変わる具体ヒント（固定文の使い回し感を解消）──

        "迷ったら、ワクワクする方を選んでみる。", "誰かに小さな頼みごとをしてみる。頼り上手の日。",
        "苦手な作業を、最初の5分だけやってみる。", "今日の予定を一つ減らして、余白をつくる。",
        "目についた場所を一か所だけ磨く。運気の通り道に。", "感謝のメッセージを一通送る。",
        "結論を急がず、一晩寝かせると吉。", "身につける色を、いつもと変えてみる。",
        "古いものを一つ手放すと、新しい流れが来る。", "声のトーンを少し上げて話してみる。",
        "今日は聞き役に回ると、思わぬ情報が入る。", "短くてもいいので、外の空気を吸う。",
        "やりたかったことを、5分だけ始めてみる。", "お金の話は、数字を見てから決める。",
        "笑える動画を一本。緊張がほどけて巡りが良くなる。", "今日の自分を、小さく一つほめる。",
        "連絡先を整理すると、人間関係も軽くなる。", "甘いものは少なめ、温かいものを選ぶと吉。",
        "一人の時間を15分つくって、頭を休める。", "気になる学びを、検索一回だけしてみる。",
        "約束は早めに確認。すれ違いを防げる日。", "姿勢よく、いつもよりゆっくり歩く。",
      ];
      const strHash = (s) => { let h = 0; for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return Math.abs(h); };
      const dailyTip = (dateISO, seed) => DAILY_TIPS[strHash(`${dateISO}|${seed || ""}`) % DAILY_TIPS.length];

      // ── AI「今日の一言」：本人の命式×今日の干支で毎日ユニークに生成。1日1回キャッシュ。──
      const DAILY_AI_STORE = "meishiki-note:dailyai:v1";
      const getDailyAI = (pkey, iso) => { try { const e = (JSON.parse(localStorage.getItem(DAILY_AI_STORE) || "{}") || {})[pkey]; return e && e.date === iso ? e.text : ""; } catch { return ""; } };
      const setDailyAI = (pkey, iso, text) => { try { const o = JSON.parse(localStorage.getItem(DAILY_AI_STORE) || "{}") || {}; o[pkey] = { date: iso, text }; localStorage.setItem(DAILY_AI_STORE, JSON.stringify(o)); } catch {} };

      // ── カスタマイズ設定（端末内に保存）──
      const SETTINGS_STORE = "meishiki-note:settings:v1";
      const DEFAULT_SECTIONS = { natal: true, wforecast: true, week: true, love: true, life: true, advisor: true, chat: true, calendar: true, jintai: true, un: true, unsei: true, aishou: true, astro: true };
      const DEFAULT_SETTINGS = { tone: "gentle", oracleName: "", replyLength: "normal", dailyOracle: true, sections: { ...DEFAULT_SECTIONS } };
      const loadSettings = () => {
        try {
          const s = JSON.parse(localStorage.getItem(SETTINGS_STORE) || "null") || {};

      };
      const saveSettings = (s) => { try { localStorage.setItem(SETTINGS_STORE, JSON.stringify(s)); } catch {} };
      // 占い師の口調・回答の長さプリセット（システムプロンプトに反映）
      const TONE_PROMPTS = {
        gentle: "やさしく寄り添う、穏やかで丁寧な口調で話す。",
        friendly: "親しみやすいフレンドリーなタメ口で、距離感近めに話す。",
        blunt: "歯に衣着せずズバッと辛口で指摘する。ただし最後は必ず前向きに背中を押す。",
        polite: "上品で格調高い、敬語の丁寧な口調で話す。",
      };
      const TONE_LABELS = { gentle: "やさしい", friendly: "フレンドリー(タメ口)", blunt: "辛口ズバッと", polite: "丁寧・上品" };
      const LENGTH_PROMPTS = { short: "回答は短く要点だけ（2〜3文）。", normal: "回答は適度な長さで。", long: "回答は具体例を交えてやや詳しめに。" };
      const LENGTH_LABELS = { short: "短め", normal: "標準", long: "詳しめ" };

      // 命式・算命学の読みを「鑑定の根拠」テキストにまとめる（システムプロンプトに渡す）
      function buildOracleContext(data, birth) {
        const lines = [];
        if (birth && birth.name) lines.push(`相談者: ${birth.name} さん`);
        if (data.chart && data.chart.text) lines.push(data.chart.text);
        const d = data.detail;
        if (d) {
          if (d.center) lines.push(`算命学・中心星（本質）: ${d.center.star}（${d.center.title}）— ${d.center.desc}`);
          if (d.dayType) lines.push(`日干タイプ: ${d.dayType.label} — ${d.dayType.desc}`);
        }
        const a = data.advisor;
        if (a) {
          if (a.fiveElements) lines.push(`五行バランス: 強「${a.fiveElements.strong}」／弱「${a.fiveElements.weak}」`);
          const fmt = (x) => `${x.headline}｜${(x.points || []).join(" / ")}`;
          if (a.business) lines.push(`【ビジネス】${fmt(a.business)}`);
          if (a.love) lines.push(`【人間関係】${fmt(a.love)}`);
          if (a.health) lines.push(`【健康】${fmt(a.health)}`);
          if (a.today) lines.push(`【今日】${fmt(a.today)}`);
        }
        if (birth && birth.memo) lines.push(`相談者からの補足メモ（重視して反映）: ${birth.memo}`);
        return lines.join("\n");
      }

      // Google Gemini API をブラウザから直接呼ぶ（無料枠・自分専用前提）
      const GEMINI_MODEL = "gemini-2.5-flash";
      // ▼ ここに Cloudflare Worker（worker.js）のURLを貼ると、ユーザーはAPIキー無しでAI相談が使えます。
      //   空のままなら従来どおり「各自のAPIキー」方式。例: "https://meishiki-ai.xxxx.workers.dev"
      const AI_PROXY = "";
      // プロキシがあれば運営キーで（ユーザーはキー不要）、無ければ各自のキーで呼ぶ統一窓口。
      async function callAI(system, messages, apiKey) {
        if (AI_PROXY) {
          const res = await fetch(AI_PROXY, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ system, messages }) });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data || data.error) throw new Error((data && data.error) || `エラー (HTTP ${res.status})`);
          if (!data.text) throw new Error("回答が空でした");
          return data.text;
        }
        return callGemini(apiKey, system, messages);
      }
      // AIが使える状態か（プロキシ設定済み or 各自キーあり）
      const aiReady = (apiKey) => !!AI_PROXY || !!apiKey;
      async function callGemini(apiKey, system, messages) {
        // Gemini のロールは user / model（assistant→model に変換）
        const contents = messages.map((m) => ({
          role: m.role === "assistant" ? "model" : "user",
          parts: [{ text: m.content }],
        }));
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const res = await fetch(url, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: system }] },
            contents,
            generationConfig: {
              maxOutputTokens: 2048,
              temperature: 0.9,
              // Gemini 2.5 は思考モデル。思考が出力枠を食って回答が途中で切れるのを防ぐため思考を無効化。
              thinkingConfig: { thinkingBudget: 0 },
            },
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const msg = (data && data.error && data.error.message) || `エラー (HTTP ${res.status})`;
          throw new Error(msg);
        }
        const cand = (data.candidates || [])[0];
        if (!cand) {
          const br = data.promptFeedback && data.promptFeedback.blockReason;
          throw new Error(br ? `安全フィルタによりブロックされました（${br}）` : "回答が空でした");
        }
        const text = ((cand.content && cand.content.parts) || []).map((p) => p.text || "").join("").trim();
        if (!text) {
          const fr = cand.finishReason;
          throw new Error(fr && fr !== "STOP" ? `回答が途中で停止しました（${fr}）` : "回答が空でした");
        }
        return text;
      }

      function Section({ title, color, children, sub, collapsible, defaultOpen = true }) {
        const [open, setOpen] = useState(defaultOpen);
        const show = open || !collapsible;
        return html`<div style=${card}>

      // ── 占術カレンダー（日ごとの気の流れ・天中殺日）──
      // relationFor 由来の日別スタンス(攻め/労い/整える/守り)を月グリッドに描画。
      // 天中殺日は本人の天中殺の十二支に当たる日。すべて端末内計算。
      const pad2 = (n) => String(n).padStart(2, "0");
      const stanceColor = (st) => st === "攻め" ? C.green : st === "労い" ? C.blue : st === "守り" ? C.red : C.accent;
      const stanceEmoji = (st) => st === "攻め" ? "🚀" : st === "労い" ? "🌿" : st === "守り" ? "🛡" : "⚖️";
      const STANCE_ACT = { 攻め: "今日は攻めどき。", 守り: "今日は守りを固める日。", 整える: "今日は淡々と整える日。", 労い: "今日は充電・自分を労わる日。" };
      function Calendar({ birth, ten, onJournalSave }) {
        const now = new Date();
        const [ym, setYm] = useState({ y: now.getFullYear(), m: now.getMonth() });
        const [selDay, setSelDay] = useState(now.getDate());
        const { y, m } = ym;
        const todayISO = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
        const dim = new Date(y, m + 1, 0).getDate();
        const firstDow = new Date(y, m, 1).getDay();
        const tenBranches = (ten && ten.branches) || [];
        const stances = useMemo(() => {
          const dates = [];
          for (let d = 1; d <= dim; d++) dates.push(`${y}-${pad2(m + 1)}-${pad2(d)}`);
          return stancesFor(birth, dates);
        }, [birth && birth.date, birth && birth.time, birth && birth.place, y, m]);
        const move = (delta) => {
          let nm = m + delta, ny = y;
          if (nm < 0) { nm = 11; ny--; } if (nm > 11) { nm = 0; ny++; }
          setYm({ y: ny, m: nm });
          setSelDay(ny === now.getFullYear() && nm === now.getMonth() ? now.getDate() : null);
        };
        const WD = ["日", "月", "火", "水", "木", "金", "土"];

        for (let d = 1; d <= dim; d++) cells.push(d);

        const navBtn = { background: C.panel2, border: `1px solid ${C.line}`, color: C.text, borderRadius: 8, padding: "6px 12px", cursor: "pointer", fontSize: 15 };

        const selInfo = selDay ? stances[isoOf(selDay)] : null;
        const selTen = selInfo && tenBranches.includes(selInfo.branch);

        return html`<div>
          <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <button onClick=${() => move(-1)} style=${navBtn}>‹</button>

          </div>
          <div style=${{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 3 }}>
            ${cells.map((d, i) => {
              if (d == null) return html`<span key=${"b" + i}></span>`;
              const info = stances[isoOf(d)];
              const col = info ? stanceColor(info.stance) : C.line;
              const isToday = isoOf(d) === todayISO;
              const isSel = d === selDay;
              const isTen = info && tenBranches.includes(info.branch);
              const entry = getEntry(isoOf(d));
              const mark = entry ? (entry.mood ? moodEmoji(entry.mood) : "📝") : "";
              return html`<button key=${d} onClick=${() => setSelDay(d)} style=${{
                position: "relative", aspectRatio: "1 / 1", display: "flex", flexDirection: "column",
                alignItems: "center", justifyContent: "center", gap: 1, cursor: "pointer",
                background: info ? col + "22" : C.panel2,
                border: `${isSel ? 2 : 1}px solid ${isSel ? col : isToday ? C.text : C.line}`,
                borderRadius: 9, padding: 2, color: C.text, lineHeight: 1.1,

                <span style=${{ fontSize: 13, fontWeight: isToday ? 800 : 600 }}>${d}</span>
                ${info && html`<span style=${{ fontSize: 9, color: C.faint }}>${info.ganZhi}</span>`}
                ${info && html`<span style=${{ fontSize: 11 }}>${stanceEmoji(info.stance)}</span>`}
                ${isTen && html`<span style=${{ position: "absolute", top: 1, right: 3, fontSize: 8, color: C.red, fontWeight: 700 }}>天</span>`}
                ${mark && html`<span style=${{ position: "absolute", bottom: 0, left: 3, fontSize: 10 }}>${mark}</span>`}

            })}
          </div>
          <div style=${{ display: "flex", flexWrap: "wrap", gap: "4px 12px", margin: "10px 0", fontSize: 11, color: C.sub }}>
            ${[["攻め", "🚀"], ["労い", "🌿"], ["整える", "⚖️"], ["守り", "🛡"]].map(([st, e]) => html`<span key=${st} style=${{ display: "inline-flex", alignItems: "center", gap: 3 }}><span style=${{ width: 9, height: 9, borderRadius: 3, background: stanceColor(st) }}></span>${e} ${st}</span>`)}
            <span style=${{ color: C.red }}>天 = 天中殺日</span>

          ${selInfo && html`<div style=${{ background: C.panel2, border: `1px solid ${stanceColor(selInfo.stance)}`, borderRadius: 10, padding: 12 }}>

              <span style=${{ color: stanceColor(selInfo.stance) }}>${stanceEmoji(selInfo.stance)} ${selInfo.stance}</span>
            </div>
            <div style=${{ fontSize: 12, color: C.sub, marginBottom: 4 }}>${selInfo.relation}</div>
            <div style=${{ fontSize: 13, color: C.text, lineHeight: 1.6 }}>${selInfo.focus}</div>
            ${selTen && html`<div style=${{ fontSize: 12, color: C.red, marginTop: 6, lineHeight: 1.6 }}>⚠️ 天中殺日：新規拡大より、整理・内省・充電が吉。大きな決断や契約は避けて。</div>`}
            <div style=${{ borderTop: `1px solid ${C.line}`, margin: "10px 0 8px" }}></div>
            <div style=${{ fontSize: 12, fontWeight: 700, color: C.green, marginBottom: 6 }}>📔 この日の記録</div>
            <${MoodPicker} key=${isoOf(selDay)} dateISO=${isoOf(selDay)} onSaved=${onJournalSave} />
          </div>`}
        </div>`;
      }

      // ── 人体星図（十字） ──
      const POS_SHORT = { center: "中央・本質", north: "頭・目上", south: "腹・社会", east: "右手・身近", west: "左手・友人" };
      function Jintai({ detail }) {

            <b style=${{ color: C.purple }}>日干タイプ：${detail.dayType.label}</b>　${detail.dayType.desc}
          </div>`}
          ${detail.pillars && html`<div style=${{ display: "flex", gap: 8, marginTop: 8 }}>
            ${[["年柱", detail.pillars.year], ["月柱", detail.pillars.month], ["日柱", detail.pillars.day]].map(([k, v]) =>
              html`<span key=${k} style=${{ background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 8, padding: "3px 10px", fontSize: 12, color: C.sub }}>${k} <b style=${{ color: C.text }}>${v}</b></span>`)}

      // ── 今日／今月／今年の運氣 ──
      function Flow({ un }) {
        const stColor = un.day.stance === "攻め" ? C.green : un.day.stance === "守り" ? C.red : un.day.stance === "労い" ? C.blue : C.accent;
        const Period = (label, u, color) => html`<div key=${label} style=${{ background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 10, padding: "9px 11px", marginBottom: 8 }}>
          <div style=${{ fontSize: 13, color, fontWeight: 700 }}>${label}　${u.emoji} ${u.star}（${u.ganzhi}）</div>

      // ノース・ノード（ドラゴンヘッド＝今生で伸ばす“魂の方向”）。サイン別。
      const NODE_SIGN = [

        "信念と大きな視野を育てる人生。細部より意味・冒険・学びへ向かうことが成長。",
        "責任を引き受け、社会で実を結ぶ人生。甘えを手放し、目標を形にするのがテーマ。",
        "枠を超え、仲間や未来・理想のために生きる人生。執着を手放し自由になることが成長。",
        "委ね・共感・スピリチュアルを育てる人生。力みを緩め、流れを信頼することがテーマ。",
      ];
      const ELEM_COLOR = { 火: "#E2554B", 地: "#C9A227", 風: "#5B8DEF", 水: "#3FB984" };
      const ELEM_THEME = { 火: "情熱・行動力・主導する力", 地: "現実力・継続・堅実さ", 風: "知性・対話・社交性", 水: "共感・感受性・直感" };
      const ELEM_LACK = { 火: "思いきった行動や自己主張", 地: "地に足をつけた継続と現実対応", 風: "客観的な情報整理と対話", 水: "感情への寄り添いと受容" };
      const ELEM_GROW = { 火: "考えすぎる前に小さく動く", 地: "派手さより積み重ねを信じる", 風: "頭で固めず人と話して広げる", 水: "気持ちを言葉にして共有する" };
      const ASPECTS_DEF = [
        { name: "コンジャンクション", glyph: "☌", angle: 0, orb: 8, nature: "強調", col: C.accent },
        { name: "セクスタイル", glyph: "⚹", angle: 60, orb: 5, nature: "調和", col: C.green },
        { name: "スクエア", glyph: "□", angle: 90, orb: 7, nature: "緊張", col: C.red },
        { name: "トライン", glyph: "△", angle: 120, orb: 8, nature: "調和", col: C.green },
        { name: "オポジション", glyph: "☍", angle: 180, orb: 8, nature: "対立", col: C.red },
      ];
      const angDiff = (a, b) => { let d = Math.abs(a - b) % 360; if (d > 180) d = 360 - d; return d; };
      const buildHoroscope = (chart) => {
        if (!chart || chart.ascDeg == null || !chart.lons) return null;
        const asc = chart.ascDeg, ascSign = Math.floor(asc / 30);
        const order = ["太陽", "月", "水星", "金星", "火星", "木星", "土星", "天王星", "海王星", "冥王星", "キロン"];
        const planets = order.filter((n) => chart.lons[n] != null).map((name) => {
          const lon = chart.lons[name], si = Math.floor(lon / 30);
          return { name, lon, signIndex: si, deg: +(lon % 30).toFixed(1), house: ((si - ascSign + 12) % 12) + 1, glyph: PLANET_INFO[name][0], outer: name === "天王星" || name === "海王星" || name === "冥王星", chiron: name === "キロン" };
        });
        const aspects = [];
        for (let i = 0; i < planets.length; i++) for (let j = i + 1; j < planets.length; j++) {
          const d = angDiff(planets[i].lon, planets[j].lon);
          for (const asp of ASPECTS_DEF) { const od = Math.abs(d - asp.angle); if (od <= asp.orb) { aspects.push({ a: planets[i], b: planets[j], asp, orb: +od.toFixed(1) }); break; } }
        }
        aspects.sort((x, y) => x.orb - y.orb);
        return { planets, asc, ascSign, mc: chart.mcDeg, mcSign: Math.floor((chart.mcDeg || 0) / 30), aspects };
      };

      // 天体が現在のサインを抜ける時期（実際の黄経を未来日でサンプリング＝逆行も反映）。
      // 「このサイン滞在の最後の瞬間」を取るため、逆行で行き来しても正しい終了時期になる。
      const ymdStr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      const accurateExit = (planet, fromSign) => {
        const STEP = planet === "土星" ? 12 : 8;          // サンプル間隔(日)
        const MAXD = planet === "土星" ? 365 * 3.2 : 365 * 1.6; // 探索範囲(日)
        let lastIn = 0;
        for (let day = 0; day <= MAXD; day += STEP) {
          const dt = new Date(Date.now() + day * 86400000);
          let lon; try { lon = bodyLongitudes(ymdStr(dt))[planet]; } catch { continue; }
          if (lon == null) continue;
          if (Math.floor((((lon % 360) + 360) % 360) / 30) === fromSign) lastIn = day;
        }
        const exitDays = lastIn + STEP / 2;
        const d = new Date(Date.now() + exitDays * 86400000);
        const months = exitDays / 30.44;
        return { months, ym: `${d.getFullYear()}年${d.getMonth() + 1}月`, label: months >= 18 ? `約${(months / 12).toFixed(1)}年後` : `約${Math.max(1, Math.round(months))}ヶ月後` };
      };

      // 周期表示用：天体の平均速度・公転周期・太陽が各サインを通る主な月
      const PLANET_AVG = { 木星: 0.0831, 土星: 0.03347 }; // °/日
      const PLANET_CYCLE = { 木星: 12, 土星: 29 };          // 年（1周）
      const SUN_MONTH = ["4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月", "1月", "2月", "3月"]; // サイン別・太陽が通る主な月
      const nextSignEntry = (planet, targetSign, curLon) => {
        const cur = (((curLon % 360) + 360) % 360), start = targetSign * 30;
        const deg = (((start - cur) % 360) + 360) % 360;
        const days = deg / PLANET_AVG[planet];
        const d = new Date(Date.now() + days * 86400000);
        return { ym: `${d.getFullYear()}年${d.getMonth() + 1}月`, years: days / 365.25 };
      };

      function Horoscope({ chart }) {
        const h = useMemo(() => buildHoroscope(chart), [chart && chart.ascDeg, chart && chart.mcDeg]);
        const [sel, setSel] = useState(0);
        if (!h) return html`<div style=${{ fontSize: 13, color: C.faint }}>チャートを計算できませんでした。</div>`;
        const cx = 160, cy = 160, rOut = 152, rSign = 120, rPlanet = 102, rHub = 90, rIn = 86;
        const pt = (r, lon) => { const rel = ((lon - h.asc) % 360 + 360) % 360; const a = (180 + rel) * Math.PI / 180; return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };
        const axis = (lon, lab1, lab2, col) => {
          const [x1, y1] = pt(rOut, lon), [x2, y2] = pt(rOut, lon + 180);
          const [lx, ly] = pt(rOut + 8, lon), [rx, ry] = pt(rOut + 8, lon + 180);
          return html`<g>
            <line x1=${x1} y1=${y1} x2=${x2} y2=${y2} stroke=${col} stroke-width="1.4" opacity="0.9" />
            <text x=${lx} y=${ly} fill=${col} font-size="9" text-anchor="middle" dominant-baseline="central">${lab1}</text>
            <text x=${rx} y=${ry} fill=${col} font-size="9" text-anchor="middle" dominant-baseline="central">${lab2}</text>
          </g>`;
        };
        const sp = h.planets[sel] || h.planets[0];
        return html`<div>
          <div style=${{ fontSize: 12, color: C.sub, marginBottom: 8, lineHeight: 1.6 }}>あなたが生まれた瞬間の空（出生図）。10天体ならぬ7天体の配置・サイン・ハウス・角度（アスペクト）を表示します。</div>
          <div style=${{ display: "flex", justifyContent: "center" }}>
          <svg viewBox="0 0 320 320" width="100%" style=${{ maxWidth: 340, display: "block" }}>
            <circle cx=${cx} cy=${cy} r=${rOut} fill=${C.panel2} stroke=${C.line} stroke-width="1" />
            <circle cx=${cx} cy=${cy} r=${rSign} fill="none" stroke=${C.line} stroke-width="1" />
            <circle cx=${cx} cy=${cy} r=${rIn} fill="none" stroke=${C.line} stroke-width="1" />
            ${SIGN_INFO.map((s, i) => {
              const [bx, by] = pt(rOut, i * 30);
              const [ix, iy] = pt(rSign, i * 30);
              const [gx, gy] = pt((rOut + rSign) / 2, i * 30 + 15);
              return html`<g key=${"s" + i}>
                <line x1=${ix} y1=${iy} x2=${bx} y2=${by} stroke=${C.line} stroke-width="0.8" />
                <text x=${gx} y=${gy} fill=${ELEM_COLOR[s[2]]} font-size="15" text-anchor="middle" dominant-baseline="central">${s[1]}</text>
              </g>`;
            })}
            ${Array.from({ length: 12 }, (_, i) => {
              const cusp = ((h.ascSign + i) % 12) * 30;
              const [nx, ny] = pt(rIn - 11, cusp + 15);
              return html`<text key=${"hn" + i} x=${nx} y=${ny} fill=${C.faint} font-size="8" text-anchor="middle" dominant-baseline="central">${i + 1}</text>`;

            ${h.aspects.map((ap, i) => { const [x1, y1] = pt(rHub, ap.a.lon); const [x2, y2] = pt(rHub, ap.b.lon); return html`<line key=${"a" + i} x1=${x1} y1=${y1} x2=${x2} y2=${y2} stroke=${ap.asp.col} stroke-width=${ap.asp.nature === "緊張" || ap.asp.nature === "対立" ? 0.8 : 1} opacity="0.5" />`; })}
            ${axis(h.asc, "ASC", "DSC", C.purple)}
            ${axis(h.mc, "MC", "IC", C.blue)}
            ${h.planets.map((p, i) => {
              const [px, py] = pt(rPlanet, p.lon);
              const on = i === sel;
              return html`<g key=${"p" + i} style=${{ cursor: "pointer" }} onClick=${() => setSel(i)}>
                ${on && html`<circle cx=${px} cy=${py} r="11" fill=${ELEM_COLOR[SIGN_INFO[p.signIndex][2]] + "33"} stroke=${ELEM_COLOR[SIGN_INFO[p.signIndex][2]]} stroke-width="1" />`}
                <text x=${px} y=${py} fill=${ELEM_COLOR[SIGN_INFO[p.signIndex][2]]} font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="central">${p.glyph}</text>
              </g>`;
            })}
          </svg>
          </div>
          <div style=${{ fontSize: 12, color: C.sub, textAlign: "center", margin: "2px 0 10px" }}>
            ASC（上昇宮）<b style=${{ color: C.purple }}>${SIGN_INFO[h.ascSign][0]}座</b>＝第一印象は「${SIGN_INFO[h.ascSign][3]}」な雰囲気　／　MC（天頂）<b style=${{ color: C.blue }}>${SIGN_INFO[h.mcSign][0]}座</b>＝社会では「${SIGN_INFO[h.mcSign][3]}」が強み
          </div>

            </div>
            ${sp.outer && html`<div style=${{ marginTop: 6, fontSize: 12, color: C.faint, lineHeight: 1.7 }}>🌌 ${sp.name}は「世代の星」（同年代は同じ星座）。サインより、<b style=${{ color: C.sub }}>第${sp.house}ハウス（${HOUSE_INFO[sp.house - 1][0]}）に表れる</b>のがあなた個人のテーマです。</div>`}
            ${sp.chiron && html`<div style=${{ marginTop: 6, fontSize: 12, color: C.faint, lineHeight: 1.7 }}>⚷ キロンは「傷と癒し」。<b style=${{ color: C.sub }}>第${sp.house}ハウス（${HOUSE_INFO[sp.house - 1][0]}）</b>に、痛みやコンプレックスを抱えやすく、だからこそ同じ痛みを持つ人を癒せるテーマがあります。（位置は高精度の近似）</div>`}

      // ── あなたという人（太陽=核・月=心・ASC=印象の署名サマリー）──
      function Signature({ chart }) {
        if (!chart || !chart.lons || chart.ascDeg == null) return null;
        const sI = (l) => Math.floor((((l % 360) + 360) % 360) / 30);

        return html`<div style=${{ background: `linear-gradient(135deg, ${C.purple}26, ${C.panel})`, border: `1px solid ${C.purple}`, borderRadius: 16, padding: 16, marginBottom: 14 }}>

            ${chip("核（太陽）", sun)}${chip("心（月）", moon)}${chip("印象（ASC）", asc)}
          </div>
          ${line("🌞", `核は ${SIGN_INFO[sun][0]}座`, SUN_SIGN_TEXT[sun])}
          ${line("🌙", `心は ${SIGN_INFO[moon][0]}座`, MOON_SIGN[moon])}
          ${line("🌅", `まとう空気は ${SIGN_INFO[asc][0]}座`, html`はじめて会う人の目には、<b style=${{ color: C.text }}>「${SIGN_INFO[asc][3]}」</b>な雰囲気をまとう人として映ります。${SIGN_INFO[asc][4]}`)}
        </div>`;
      }

      // ── 総合鑑定（エレメント配分＋主要アスペクトから強み・課題・伸ばし方を統合）──
      function Insight({ chart }) {
        const h = useMemo(() => buildHoroscope(chart), [chart && chart.ascDeg]);
        if (!h) return null;
        const classical = ["太陽", "月", "水星", "金星", "火星", "木星", "土星"];
        const cnt = { 火: 0, 地: 0, 風: 0, 水: 0 };
        h.planets.forEach((p) => { if (classical.includes(p.name)) cnt[SIGN_INFO[p.signIndex][2]]++; });
        const elems = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
        const dom = elems[0][0], lackEntry = elems[elems.length - 1], lack = lackEntry[0], lackN = lackEntry[1];
        const harmo = h.aspects.find((a) => a.asp.nature === "調和" || a.asp.nature === "強調");
        const tense = h.aspects.find((a) => a.asp.nature === "緊張" || a.asp.nature === "対立");
        const pn = (x) => `${PLANET_INFO[x][0]}${x}`;
        return html`<div style=${{ ...card, border: `1px solid ${C.accent}` }}>
          <div style=${{ fontSize: 16, fontWeight: 800, color: C.accent, marginBottom: 8 }}>🔎 総合鑑定</div>
          <div style=${{ fontSize: 13.5, lineHeight: 1.9, color: C.text, display: "flex", flexDirection: "column", gap: 8 }}>
            <div>💪 <b style=${{ color: C.green }}>強み</b>：<b style=${{ color: ELEM_COLOR[dom] }}>${dom}の力</b>が豊かで、<b>${ELEM_THEME[dom]}</b>が持ち味。${harmo ? html`特に <b>${pn(harmo.a.name)}と${pn(harmo.b.name)}</b> が${harmo.asp.name}で響き合い、${PLANET_INFO[harmo.a.name][1]}と${PLANET_INFO[harmo.b.name][1]}を自然に両立できます。` : ""}</div>
            <div>⚠️ <b style=${{ color: C.red }}>課題</b>：${lackN === 0 ? html`<b style=${{ color: ELEM_COLOR[lack] }}>${lack}の要素</b>が手薄で、<b>${ELEM_LACK[lack]}</b>が後回しになりがち。` : html`バランス型。`}${tense ? html`また <b>${pn(tense.a.name)}と${pn(tense.b.name)}</b> の${tense.asp.name}が内面の葛藤を生みやすく、ここが成長のカギ。` : ""}</div>
            <div>🌱 <b style=${{ color: C.accent }}>伸ばし方</b>：${ELEM_GROW[dom]}こと。そして${lackN === 0 ? `${ELEM_LACK[lack]}を少しずつ補う` : `強みに偏りすぎない`}と、力がさらに開きます。</div>
          </div>
        </div>`;
      }

      // ── 魂の課題（ドラゴンヘッド＝ノース／サウスノード）──
      function SoulNode({ chart }) {
        if (!chart || !chart.lons || chart.lons.ノード == null || chart.ascDeg == null) return null;
        const sI = (l) => Math.floor((((l % 360) + 360) % 360) / 30);
        const ascSign = sI(chart.ascDeg);
        const nn = sI(chart.lons.ノード), sn = (nn + 6) % 12;
        const nnHouse = ((nn - ascSign + 12) % 12) + 1, snHouse = ((sn - ascSign + 12) % 12) + 1;
        return html`<div style=${{ ...card, border: `1px solid ${C.purple}` }}>
          <div style=${{ fontSize: 16, fontWeight: 800, color: C.purple, marginBottom: 4 }}>🐉 魂の課題（ドラゴンヘッド）</div>

      // ── 根拠・精度の透明性（人の監修に頼らず、計算と方法の開示で信頼を担保）──

          ${li(html`<b style=${{ color: C.text }}>決定論（ブレない）</b>：同じ生年月日・時刻なら毎回まったく同じ結果。ランダムな“当たり外れ”ではありません。`)}
          ${li(html`<b style=${{ color: C.text }}>西洋占星術の方式</b>：トロピカル／ホールサイン・ハウス／主要5アスペクト（合・セクスタイル・スクエア・トライン・オポジション、オーブ5〜8°）。ASC・MC・10天体・ドラゴンヘッド（平均ノード）を計算。`)}

          ${li(html`<b style=${{ color: C.text }}>根拠が見える</b>：各リーディングは、あなたの実際のチャート（天体・サイン・ハウス・角度）に基づいて表示しています。`)}
          ${li(html`<b style=${{ color: C.text }}>プライバシー</b>：計算・保存はすべて端末内で完結。生年月日を外部に送信しません（AI相談を使う時だけ内容を送信）。`)}
          <div style=${{ fontSize: 11.5, color: C.faint, lineHeight: 1.7, marginTop: 4 }}>※ 占いは未来を断定するものではなく、自己理解と行動のヒントです。健康・法律・投資など重要な判断は専門家にご相談ください。</div>

      function AstroForecast({ natal, transit, birth, exits }) {
        const [tab, setTab] = useState("day");
        if (!natal || natal.ascDeg == null || !transit || !transit.lons) return html`<div style=${{ fontSize: 13, color: C.faint }}>運勢を計算できませんでした。</div>`;
        const norm360 = (x) => ((x % 360) + 360) % 360;
        const ascSign = Math.floor(norm360(natal.ascDeg) / 30);
        const sIdx = (lon) => Math.floor(norm360(lon) / 30);
        const hOf = (lon) => ((sIdx(lon) - ascSign + 12) % 12) + 1;
        const L = transit.lons, N = natal.lons;
        const signN = (i) => `${SIGN_INFO[i][1]} ${SIGN_INFO[i][0]}座`;
        const houseN = (hi) => `第${hi}ハウス（${HOUSE_INFO[hi - 1][0]}）`;
        const elemCol = (i) => ELEM_COLOR[SIGN_INFO[i][2]];
        let age = 0; try { age = (Date.now() - new Date(birth.date + "T12:00:00").getTime()) / (365.25 * 86400000); } catch {}
        const RET = [29.5, 58.5, 88]; const nextRet = RET.find((a) => a > age) || RET[RET.length - 1];
        const retYear = birth && birth.date ? new Date(birth.date).getFullYear() + Math.round(nextRet) : null;
        const tabs = [["day", "☽ 今日"], ["month", "☀ 今月"], ["year", "♃ 今年"], ["fate", "✦ 運命"]];
        const block = (col, head, body, note) => html`<div style=${{ background: C.panel2, border: `1px solid ${col}`, borderRadius: 12, padding: 13 }}>
          <div style=${{ fontSize: 14, fontWeight: 700, color: col, marginBottom: 6 }}>${head}</div>
          <div style=${{ fontSize: 13, lineHeight: 1.8, color: C.text }}>${body}</div>
          ${note && html`<div style=${{ fontSize: 11, color: C.faint, marginTop: 6 }}>${note}</div>`}
        </div>`;
        const row = (e, label, text) => html`<div style=${{ marginBottom: 5 }}><b>${e} ${label}：</b>${text}</div>`;
        let content;
        if (tab === "day") {
          const s = sIdx(L.月), h = hOf(L.月), col = elemCol(s);
          content = block(col, `☽ 今日：月が${signN(s)}・あなたの${houseN(h)}へ`,
            html`今日は<b style=${{ color: col }}>${HOUSE_INFO[h - 1][0]}</b>に光が当たる日。${HOUSE_INFO[h - 1][1]} 心のモードは「${SIGN_INFO[s][3]}」——${SIGN_INFO[s][4]}`,
            "月は約2.5日で星座を移動。毎日テーマが変わります。");
        } else if (tab === "month") {
          const s = sIdx(L.太陽), h = hOf(L.太陽), col = elemCol(s);
          content = block(col, `☀ 今月：太陽が${signN(s)}・あなたの${houseN(h)}を巡る`,
            html`今月は<b style=${{ color: col }}>${HOUSE_INFO[h - 1][0]}</b>にエネルギーが集まる時期。${HOUSE_INFO[h - 1][1]} ここに時間と意識を注ぐと流れに乗れます。`,
            "太陽は約1か月で星座を移動。月単位のテーマです。");
        } else if (tab === "year") {
          const jh = hOf(L.木星), sh = hOf(L.土星), js = sIdx(L.木星), ss = sIdx(L.土星);
          const jx = exits && exits.木星, sx = exits && exits.土星;
          content = html`<div style=${{ display: "flex", flexDirection: "column", gap: 10 }}>
            ${block(C.green, `♃ 今年の追い風：木星が${signN(js)}・${houseN(jh)}`,
              html`<b style=${{ color: C.green }}>${HOUSE_INFO[jh - 1][0]}</b>が拡大・チャンスのテーマ。${HOUSE_INFO[jh - 1][1]} ここは思いきって広げると吉。${jx ? html`<br /><span style=${{ color: C.faint }}>この幸運期は <b style=${{ color: C.green }}>${jx.ym}ごろまで</b>（${jx.label}・目安）。</span>` : ""}`,
              "木星は約1年で星座を移動。1年の幸運の方向。")}
            ${block(C.blue, `♄ 今年の課題：土星が${signN(ss)}・${houseN(sh)}`,
              html`<b style=${{ color: C.blue }}>${HOUSE_INFO[sh - 1][0]}</b>で責任・努力が問われ、乗り越えると実力と信頼に変わる領域。${sx ? html`<br /><span style=${{ color: C.faint }}>この正念場は <b style=${{ color: C.blue }}>${sx.ym}ごろまで</b>（${sx.label}・目安）。</span>` : ""}`,
              "土星は約2.5年で星座を移動。鍛えられるテーマ。")}
          </div>`;
        } else {
          const ns = sIdx(N.太陽), nh = hOf(N.太陽), mc = sIdx(norm360(natal.mcDeg)), col = elemCol(ns);
          const OUTER = [["天王星", "♅", "変革・自由の風", C.blue], ["海王星", "♆", "夢・癒し・スピリチュアル", C.green], ["冥王星", "♇", "根本からの変容・再生", C.red]];
          const outerRows = OUTER.filter((o) => L[o[0]] != null).map(([nm, gl, th, cc]) => row(gl, nm, html`<b style=${{ color: cc }}>第${hOf(L[nm])}ハウス（${HOUSE_INFO[hOf(L[nm]) - 1][0]}）</b>に <b>${th}</b>（数年がかりの大きな節目）`));
          content = block(C.purple, "✦ あなたの運命のテーマ（出生図より）",
            html`${row("🌞", "人生の目的", html`太陽 <b style=${{ color: col }}>${SIGN_INFO[ns][0]}座</b>＝${SIGN_INFO[ns][3]}`)}
              ${row("🌅", "生き方の入口(ASC)", html`<b style=${{ color: C.purple }}>${SIGN_INFO[ascSign][0]}座</b>＝${SIGN_INFO[ascSign][3]}`)}
              ${row("🏔", "社会的使命(MC)", html`<b style=${{ color: C.blue }}>${SIGN_INFO[mc][0]}座</b>＝${SIGN_INFO[mc][3]}`)}
              ${row("🎭", "活躍の舞台", houseN(nh))}
              ${row("🪐", "人生の節目(土星回帰)", `約${nextRet}歳ごろ${retYear ? `（${retYear}年前後）` : ""}——生き方が問い直され、本物の土台ができる転換期。`)}`,
            "出生図に刻まれた、変わらない“持ち味と宿命”の見取り図です。");
          content = html`<div style=${{ display: "flex", flexDirection: "column", gap: 10 }}>
            ${content}
            ${outerRows.length > 0 && block(C.red, "🌌 いま人生を動かす大きな星（外惑星）",
              html`${outerRows}`,
              "天王星・海王星・冥王星は数年〜十数年かけて1つの分野を深く変えます。今その変容が起きている人生領域です。")}
          </div>`;
        }
        return html`<div>
          <div style=${{ fontSize: 12, color: C.sub, marginBottom: 10, lineHeight: 1.6 }}>運行中の天体（トランジット）をあなたの出生図に重ねた、西洋占星術ベースの運勢です。</div>
          <div style=${{ display: "flex", gap: 6, marginBottom: 12, flexWrap: "wrap" }}>
            ${tabs.map(([k, label]) => { const on = tab === k; return html`<button key=${k} onClick=${() => setTab(k)} style=${{ border: `1px solid ${on ? C.purple : C.line}`, background: on ? C.purple + "22" : C.panel2, color: on ? C.purple : C.text, borderRadius: 999, padding: "6px 13px", fontSize: 13, cursor: "pointer", fontWeight: on ? 700 : 400 }}>${label}</button>`; })}
          </div>
          ${content}
        </div>`;
      }

      // ── 西洋占星術の相性（シナストリー）：2人の出生図を重ねて読む ──
      const ELEM_PAIR = (a, b) => {
        if (a === b) return 5;
        const fa = (x) => x === "火" || x === "風", ew = (x) => x === "地" || x === "水";
        if ((fa(a) && fa(b)) || (ew(a) && ew(b))) return 4;
        return 2;
      };
      const KEYPAIRS = [
        ["金星", "火星", "💘 金星 × 火星（恋愛の引力）", "ときめきと情熱が自然に通い合う、恋愛運の強い組み合わせ。", "惹かれ合うけれど刺激も強め。ペースの違いを尊重すると長続き。"],
        ["太陽", "月", "🌞🌙 太陽 × 月（安心と一体感）", "素の相手を受け止め合える、安心できる相性。", "価値観と感情のリズムが違う二人。歩み寄りが鍵。"],
        ["太陽", "太陽", "☀ 太陽 × 太陽（人生の方向）", "人生の向きが響き合い、一緒に伸びていける。", "自我がぶつかりやすいが、互いを成長させる関係。"],
        ["月", "月", "🌙 月 × 月（感情のテンポ）", "感情のテンポが合い、一緒にいて落ち着く。", "安心の条件が違う。気持ちを言葉にして共有を。"],
        ["水星", "水星", "💬 水星 × 水星（会話）", "会話と考え方が噛み合い、話していて楽しい。", "話のかみ合わせに差。聞き方を工夫すると好転。"],
      ];
      const buildSynastry = (a, b) => {
        if (!a || !b) return null;
        const sIdx = (lon) => Math.floor((((lon % 360) + 360) % 360) / 30);
        const order = ["太陽", "月", "水星", "金星", "火星"];
        let har = 0, ten = 0;
        for (const pa of order) for (const pb of order) {
          if (a[pa] == null || b[pb] == null) continue;
          const d = angDiff(a[pa], b[pb]);
          for (const asp of ASPECTS_DEF) {
            if (Math.abs(d - asp.angle) <= asp.orb) {
              if (asp.nature === "調和" || asp.nature === "強調") har++;
              else if (asp.nature === "緊張" || asp.nature === "対立") ten++;
              break;
            }
          }
        }
        const highlights = KEYPAIRS.map(([p1, p2, title, good, chall]) => {
          const cand = [];
          const tryPair = (x, y) => { if (a[x] == null || b[y] == null) return; const d = angDiff(a[x], b[y]); for (const asp of ASPECTS_DEF) { if (Math.abs(d - asp.angle) <= asp.orb) { cand.push(asp); break; } } };
          tryPair(p1, p2); if (p1 !== p2) tryPair(p2, p1);
          if (!cand.length) return null;
          const asp = cand[0], harmo = asp.nature === "調和" || asp.nature === "強調";
          return { title, asp, harmo, text: harmo ? good : chall };
        }).filter(Boolean);
        const aSun = sIdx(a.太陽), bSun = sIdx(b.太陽);
        const sunComp = ELEM_PAIR(SIGN_INFO[aSun][2], SIGN_INFO[bSun][2]);
        let score = 50 + har * 5 - ten * 3 + (sunComp - 3) * 4;
        score = Math.max(20, Math.min(98, Math.round(score)));
        const label = score >= 80 ? "とても良い相性" : score >= 60 ? "良い相性" : score >= 40 ? "努力で深まる相性" : "刺激的な相性";
        return { score, label, har, ten, highlights, aSun, bSun, aMoon: sIdx(a.月), bMoon: sIdx(b.月), aVenus: sIdx(a.金星), bVenus: sIdx(b.金星), sunComp };
      };

      function Synastry({ chart }) {
        const [b, setB] = useState({ date: "", time: "", name: "" });
        const [res, setRes] = useState(null);
        const [err, setErr] = useState("");
        const run = () => {
          setErr("");
          if (!b.date) { setErr("相手の生年月日を入れてください"); return; }
          try {
            const pc = computeChart({ date: b.date, time: b.time || "12:00", lat: 35.68, lon: 139.69, utcOffset: 9 });
            const syn = buildSynastry(chart.lons, pc.lons);
            if (!syn) { setErr("計算できませんでした"); return; }
            setRes(syn);
          } catch (e) { setErr(String(e.message || e)); }
        };
        const barCol = res ? (res.score >= 80 ? C.green : res.score >= 60 ? C.accent : res.score >= 40 ? C.blue : C.red) : C.line;
        const sg = (i) => `${SIGN_INFO[i][1]} ${SIGN_INFO[i][0]}座`;
        return html`<div>
          <div style=${{ fontSize: 12, color: C.faint, marginBottom: 8, lineHeight: 1.6 }}>相手（恋人・気になる人・友人など）の生年月日を入れると、あなたの出生図と重ねた西洋占星術の相性が出ます。時刻は分かれば。</div>
          <input placeholder="相手の名前（任意）" value=${b.name} onInput=${(e) => setB({ ...b, name: e.target.value })} style=${inp} />
          <input type="date" value=${b.date} onInput=${(e) => setB({ ...b, date: e.target.value })} style=${inp} />
          <input type="time" value=${b.time} onInput=${(e) => setB({ ...b, time: e.target.value })} style=${inp} />
          <button onClick=${run} style=${{ ...inp, background: C.purple, color: C.onAccent, fontWeight: 700, border: "none", cursor: "pointer" }}>相性を見る</button>
          ${err && html`<div style=${{ fontSize: 13, color: C.red }}>${err}</div>`}
          ${res && html`<div style=${{ marginTop: 6 }}>
            <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
              <span style=${{ fontSize: 15, fontWeight: 700 }}>${res.label}</span>

            </div>
            <div style=${{ height: 8, background: C.panel2, borderRadius: 5, overflow: "hidden", border: `1px solid ${C.line}`, marginBottom: 10 }}>
              <div style=${{ width: `${res.score}%`, height: "100%", background: barCol }}></div>
            </div>
            <div style=${{ display: "flex", flexDirection: "column", gap: 4, fontSize: 13, color: C.sub, marginBottom: 10 }}>
              <div>☀ 太陽：あなた <b style=${{ color: C.text }}>${sg(res.aSun)}</b> × 相手 <b style=${{ color: C.text }}>${sg(res.bSun)}</b>（${res.sunComp >= 5 ? "同じ気質で安心" : res.sunComp >= 4 ? "気質が響き合う" : "違う気質で刺激的"}）</div>
              <div>🌙 月：あなた <b style=${{ color: C.text }}>${sg(res.aMoon)}</b> × 相手 <b style=${{ color: C.text }}>${sg(res.bMoon)}</b></div>
              <div>♀ 金星：あなた <b style=${{ color: C.text }}>${sg(res.aVenus)}</b> × 相手 <b style=${{ color: C.text }}>${sg(res.bVenus)}</b></div>
            </div>
            ${res.highlights.length > 0 && html`<div style=${{ display: "flex", flexDirection: "column", gap: 7 }}>
              ${res.highlights.map((h, i) => html`<div key=${i} style=${{ background: C.panel2, border: `1px solid ${h.harmo ? C.green : C.red}`, borderRadius: 10, padding: "9px 11px" }}>
                <div style=${{ fontSize: 13, fontWeight: 700, marginBottom: 2 }}>${h.title} <span style=${{ color: h.asp.col, fontWeight: 700 }}>${h.asp.glyph} ${h.asp.name}</span></div>
                <div style=${{ fontSize: 13, lineHeight: 1.6, color: C.sub }}>${h.text}</div>
              </div>`)}
            </div>`}
            <div style=${{ fontSize: 12, color: C.faint, marginTop: 8, lineHeight: 1.6 }}>調和の角度 ${res.har} ・ 緊張の角度 ${res.ten}（2人の太陽・月・水星・金星・火星の角度から算出）。占いとして楽しんで。</div>
          </div>`}
        </div>`;
      }

      // ── 恋愛・異性への関心（自分の出生図：金星・火星・月・DSC）──
      function Love({ chart, transit }) {
        const [open, setOpen] = useState(false);
        if (!chart || !chart.lons || chart.ascDeg == null) return html`<div style=${{ fontSize: 13, color: C.faint }}>計算できませんでした。</div>`;
        const sIdx = (lon) => Math.floor((((lon % 360) + 360) % 360) / 30);
        const v = sIdx(chart.lons.金星), m = sIdx(chart.lons.火星), mo = sIdx(chart.lons.月);
        const ascSign = sIdx(chart.ascDeg), dsc = (ascSign + 6) % 12;
        const vHouse = ((v - ascSign + 12) % 12) + 1;
        const sg = (i) => `${SIGN_INFO[i][1]} ${SIGN_INFO[i][0]}座`;
        const col = (i) => ELEM_COLOR[SIGN_INFO[i][2]];
        // 恋の運勢（運行中の金星 × 出生図）
        const lf = (() => {
          if (!transit || !transit.lons || transit.lons.金星 == null) return null;
          const tv = transit.lons.金星, tvS = sIdx(tv), tvH = ((tvS - ascSign + 12) % 12) + 1;
          const targets = [["太陽", "人生・自己表現"], ["金星", "愛・魅力"], ["火星", "情熱・行動"]];
          const hits = [];
          for (const [tn, lab] of targets) { if (chart.lons[tn] == null) continue; const d = angDiff(tv, chart.lons[tn]); for (const asp of ASPECTS_DEF) { if (Math.abs(d - asp.angle) <= asp.orb) { hits.push({ tn, lab, asp, harmo: asp.nature === "調和" || asp.nature === "強調" }); break; } } }
          return { tvS, tvH, hits };
        })();
        const card2 = (c, head, body) => html`<div style=${{ background: C.panel2, border: `1px solid ${c}`, borderRadius: 12, padding: 13, marginBottom: 10 }}>
          <div style=${{ fontSize: 14, fontWeight: 700, marginBottom: 4 }}>${head}</div>
          <div style=${{ fontSize: 13, lineHeight: 1.8, color: C.sub }}>${body}</div>
        </div>`;
        return html`<div>
          <div style=${{ fontSize: 12, color: C.faint, marginBottom: 10, lineHeight: 1.6 }}>あなたの出生図から、恋愛のしかた・惹かれるタイプ・アプローチの傾向を読み解きます。</div>
          ${card2(col(v), html`♀ 金星 <span style=${{ color: col(v) }}>${sg(v)}</span>：愛し方・好みのタイプ`, VENUS_LOVE[v])}

      // ── 分野別の動き方・課題（出生図のハウス×サイン）──

            <div style=${{ fontSize: 13, lineHeight: 1.8, color: C.text }}>⚠️ <b style=${{ color: C.red }}>気をつけること</b>：${SIGN_MOVE[si][1]}</div>
            ${here.length > 0 && html`<div style=${{ marginTop: 8, fontSize: 12.5, color: C.sub, lineHeight: 1.8 }}>💪 <b style=${{ color: C.text }}>生まれ持つ強み</b>：${here.map((n) => `${PLANET_INFO[n][0]}${n}（${PLANET_INFO[n][1]}）`).join("・")}が特に効く分野。</div>`}

                ${hasT && html`<div>🍀 <b style=${{ color: C.green }}>チャンスが広がる時期</b>：${houseNum === jupH ? html`<b>今まさに！</b>（${exits && exits.木星 ? exits.木星.ym : "—"}ごろまで）` : (() => { const e = nextSignEntry("木星", si, transit.lons.木星); return html`<b>${e.ym}ごろ</b>（約${Math.round(e.years)}年後）`; })()}</div>`}

      // ── 今週のハイライト（運行中の月×出生図で7日間の好機/注意を抽出）──
      const TN_THEME = {
        太陽: ["自分を打ち出す・新しいことを始める", "自我の空回りに注意"],
        月: ["気持ち・家庭・癒しが充実", "気分の波に注意、休息を"],
        水星: ["連絡・契約・移動・学びが進む", "早とちり・連絡ミスに注意"],
        金星: ["恋愛・楽しみ・美容・人付き合いに追い風", "散財・なあなあに注意"],
        火星: ["行動・勝負・運動に勢い", "衝突・焦り・ケガに注意"],
        木星: ["拡大・チャンス・幸運が広がる", "広げ過ぎ・楽観し過ぎに注意"],
        土星: ["地道な前進が実りやすい", "プレッシャー・停滞、無理しない"],
      };
      function WeekHighlight({ natal, birth }) {
        const wk = useMemo(() => {
          if (!natal || !natal.lons || natal.ascDeg == null || !birth || !birth.date) return null;
          const sIdx = (l) => Math.floor((((l % 360) + 360) % 360) / 30);
          const ascSign = sIdx(natal.ascDeg), N = natal.lons;
          const benefic = new Set(["太陽", "月", "金星", "木星"]), malefic = new Set(["土星", "火星"]);
          const order = ["太陽", "月", "水星", "金星", "火星", "木星", "土星"];
          const out = [];
          for (let d = 0; d < 7; d++) {
            const dt = new Date(Date.now() + d * 86400000);
            const iso = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
            let moon; try { moon = bodyLongitudes(iso, "12:00", birth.utcOffset).月; } catch { continue; }
            const mH = ((sIdx(moon) - ascSign + 12) % 12) + 1;
            let score = 0, best = null;
            for (const tn of order) {
              if (N[tn] == null) continue; const diff = angDiff(moon, N[tn]);
              for (const asp of ASPECTS_DEF) {
                if (Math.abs(diff - asp.angle) <= asp.orb) {
                  const harmo = asp.nature === "調和" || asp.nature === "強調";
                  const s = harmo ? (benefic.has(tn) ? 2 : 1) : (malefic.has(tn) ? -2 : -1);
                  score += s; if (!best || Math.abs(s) > Math.abs(best.s)) best = { tn, asp, harmo, s };
                  break;
                }
              }
            }
            out.push({ iso, dow: dt.getDay(), date: dt.getDate(), mH, score, best });
          }
          if (!out.length) return null;
          let hi = out[0], lo = out[0];
          out.forEach((o) => { if (o.score > hi.score) hi = o; if (o.score < lo.score) lo = o; });
          return { out, hi: hi.score > 0 ? hi : null, lo: lo.score < 0 ? lo : null };
        }, [natal && natal.ascDeg, birth && birth.date, birth && birth.time, birth && birth.place]);
        if (!wk) return null;
        const emo = (s) => s >= 2 ? "🌟" : s > 0 ? "🙂" : s < 0 ? "⚠️" : "・";
        const sc = (s) => s > 0 ? C.green : s < 0 ? C.red : C.line;
        const dayCard = (o, kind) => {
          const c = kind === "hi" ? C.green : C.red;
          const adv = o.best ? TN_THEME[o.best.tn][o.best.harmo ? 0 : 1] : `${HOUSE_INFO[o.mH - 1][0]}に光が当たる日`;
          const asp = o.best ? `月 ${o.best.asp.glyph}${o.best.asp.name} あなたの${o.best.tn}` : `月が第${o.mH}ハウスを通過`;
          return html`<div style=${{ background: c + "1A", border: `1px solid ${c}`, borderRadius: 10, padding: "9px 11px", marginTop: 8 }}>
            <div style=${{ fontSize: 13, fontWeight: 700, color: c, marginBottom: 2 }}>${kind === "hi" ? "🌟 好機" : "⚠️ 要注意"}：${o.date}日(${WD_JP[o.dow]})</div>
            <div style=${{ fontSize: 12.5, lineHeight: 1.7, color: C.text }}>${adv}<br /><span style=${{ color: C.faint }}>${asp}・第${o.mH}ハウス</span></div>
          </div>`;
        };
        return html`<div>
          <div style=${{ fontSize: 12, color: C.faint, marginBottom: 10, lineHeight: 1.6 }}>運行中の月があなたの出生図を巡る7日間の流れ。好機と要注意の日をピックアップします。</div>
          <div style=${{ display: "flex", gap: 4, marginBottom: 4 }}>
            ${wk.out.map((o, i) => html`<div key=${i} style=${{ flex: 1, textAlign: "center", background: sc(o.score) + "1A", border: `1px solid ${sc(o.score)}`, borderRadius: 8, padding: "6px 0" }}>
              <div style=${{ fontSize: 10, color: C.faint }}>${WD_JP[o.dow]}</div>
              <div style=${{ fontSize: 13, fontWeight: 700, color: C.text }}>${o.date}</div>
              <div style=${{ fontSize: 13 }}>${emo(o.score)}</div>
            </div>`)}
          </div>
          ${wk.hi && dayCard(wk.hi, "hi")}
          ${wk.lo && dayCard(wk.lo, "lo")}
          ${!wk.hi && !wk.lo && html`<div style=${{ fontSize: 13, color: C.sub, marginTop: 8 }}>今週は比較的おだやかな流れ。淡々と整えるのに向く週です。</div>`}
        </div>`;

      const MINCHO = '"Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif'; // 鑑定書用の明朝体
      const CONSULT_CATS = [["💼 仕事・キャリア", 10], ["💞 恋愛・結婚", 7], ["💰 お金・投資", 2], ["🏠 引っ越し・環境", 4], ["🤝 人間関係", 11], ["📚 学び・挑戦", 9], ["🌱 その他・自分のこと", 1]];
      // みんなが特に気になる“定番の質問”。ワンタップで質問文＆分野が入る。[質問文, 分野index]
      const POPULAR_Q = [
        ["運命の人とはいつ、どこで出会える？", 1],
        ["今の恋は結婚まで進む？", 1],
        ["あの人は私のことをどう思ってる？", 1],
        ["転職・独立するべき？そのタイミングは？", 0],
        ["私に向いている仕事・天職は？", 0],
        ["金運が上がるのはいつ？お金の不安は消える？", 2],
        ["今年、人生の転機はいつ来る？", 6],
        ["この人間関係、続ける？距離を置く？", 4],
        ["私の本当の性格・強みは？", 6],
      ];
      function Consult({ birth, chart, transit, exits, apiKey, context, tone }) {
        const [cat, setCat] = useState(0);
        const [q, setQ] = useState("");
        const [ans, setAns] = useState("");
        const [busy, setBusy] = useState(false);
        const [err, setErr] = useState("");
        const honor = birth && birth.name ? `${birth.name}さん` : "あなた";
        const sIdx = (l) => Math.floor((((l % 360) + 360) % 360) / 30);
        const ascSign = chart && chart.ascDeg != null ? sIdx(chart.ascDeg) : 0;
        const f = useMemo(() => {
          if (!chart || !chart.lons) return null;
          const houseNum = CONSULT_CATS[cat][1], si = (ascSign + houseNum - 1) % 12;
          const tH = (n) => (transit && transit.lons && transit.lons[n] != null) ? ((sIdx(transit.lons[n]) - ascSign + 12) % 12) + 1 : null;
          const jup = tH("木星"), sat = tH("土星"), sun = tH("太陽");
          const nextJup = (transit && transit.lons && transit.lons.木星 != null) ? nextSignEntry("木星", si, transit.lons.木星) : null;
          let tone2, label, col;
          if (houseNum === jup) { tone2 = "go"; label = `追い風（${exits && exits.木星 ? exits.木星.ym + "ごろまで" : "今"}）`; col = C.green; }
          else if (houseNum === sat) { tone2 = "wait"; label = `正念場（${exits && exits.土星 ? exits.土星.ym + "ごろまで" : ""}）`; col = C.blue; }
          else if (houseNum === sun) { tone2 = "now"; label = "今月スポット"; col = C.accent; }
          else { tone2 = "prep"; label = "穏やか（仕込み期）"; col = C.purple; }
          const sun2 = sIdx(chart.lons.太陽), merc = chart.lons.水星 != null ? sIdx(chart.lons.水星) : sun2;
          const dates = [];
          for (let i = 0; i < 14; i++) { const d = new Date(Date.now() + i * 86400000); dates.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`); }
          let st = {}; try { st = stancesFor(birth, dates) || {}; } catch {}
          const good = dates.filter((d) => st[d] && st[d].stance === "攻め").slice(0, 3);
          return { houseNum, si, tone2, label, col, nextJup, sun2, merc, good };
        }, [cat, chart && chart.ascDeg]);
        const fmtD = (iso) => { const d = new Date(iso + "T00:00:00"); return `${d.getMonth() + 1}/${d.getDate()}(${WD_JP[d.getDay()]})`; };
        const goodTxt = () => f.good.length ? f.good.map(fmtD).join("　/　") : "この2週間は“攻め”の日は控えめ。準備・情報集めに。";

        const stanceLine = () => {
          if (!f) return "";
          const nj = f.nextJup ? `次の追い風は${f.nextJup.ym}ごろ` : "次の好機を見据えて";
          if (f.tone2 === "go") return "結論：今は追い風。迷うより、動くなら今のうち。小さく一歩を踏み出して流れに乗って。";
          if (f.tone2 === "wait") return `結論：今は土台を固める時期。大きな決断は急がず、${nj}に向けて準備と実力づくりを。`;
          if (f.tone2 === "now") return "結論：今月がチャンス。1か月以内に最初の一歩を起こすと流れに乗れる。";
          return `結論：外の波は穏やか＝“仕込み”の好機。大勝負は${nj}に取っておき、今は土台づくり・情報集め・小さな試運転を。`;
        };
        const detFallback = () => `${honor}、ご相談を確かに受け取りました。星の巡りと、あなたの生まれ持った質から読み解きます。\n\n${stanceLine()}\n\nあなたは太陽${SIGN_INFO[f.sun2][0]}座（${SIGN_INFO[f.sun2][3]}）×水星${SIGN_INFO[f.merc][0]}座（${SIGN_INFO[f.merc][3]}）で物事を決めていく方。この件では「${SIGN_MOVE[f.si][0]}」があなたの追い風となり、一方で「${SIGN_MOVE[f.si][1]}」に少し心を配ると、流れがいっそう整うでしょう。\n\n動くなら、${goodTxt()}\n\n最終的に決めるのは、あなた自身です。星はただ、そっと背中を押すだけ。`;

        const factsText = () => {
          const nj = f.nextJup ? `${f.nextJup.ym}ごろ` : "不明";
          return `- 相談分野: ${CONSULT_CATS[cat][0]}（${HOUSE_INFO[f.houseNum - 1][0]}）\n- 今の時期: ${f.label}（${f.tone2 === "go" ? "拡大・挑戦に良い" : f.tone2 === "wait" ? "試練・準備期、大決断は慎重に" : f.tone2 === "now" ? "今月動きやすい" : "穏やか＝仕込み向き"}）\n- 次に追い風(木星)が来る時期: ${nj}\n- この分野でのあなたの傾向: ${SIGN_INFO[f.si][0]}座=${SIGN_MOVE[f.si][0]} / 注意=${SIGN_MOVE[f.si][1]}\n- 決断スタイル: 太陽${SIGN_INFO[f.sun2][0]}座(${SIGN_INFO[f.sun2][3]}) × 水星${SIGN_INFO[f.merc][0]}座(${SIGN_INFO[f.merc][3]})\n- 動きやすい日(2週間): ${f.good.length ? f.good.map(fmtD).join(", ") : "なし（準備向き）"}`;
        };
        const run = async () => {
          setErr("");
          if (!aiReady(apiKey)) { setAns(detFallback()); return; }
          setBusy(true); setAns("");
          try {
            const sys = `あなたは相談者の専属占術師です。下の「占いの根拠(facts)」と「命式」に基づき、相談者の悩みへの鑑定を、格調ある“鑑定書”の文体で綴ってください。曖昧に逃げず、しかし断定しすぎないこと。占い用語は噛み砕く。
# 文体（鑑定書スタイル）

      // ── 気分ログ入力（今日／カレンダー選択日で共用）──
      function MoodPicker({ dateISO, onSaved, placeholder }) {

      // ── 今日のスレッド（TimeTree式：日付という箱に「運氣＋リアクション＋ひとこと＋ふり返り」を1本化）──
      function TodayThread({ birth, jv, onSaved }) {
        const todayISO = ymd(new Date());
        const j = loadJournal();
        const past = Object.keys(j).filter((d) => d !== todayISO).sort().reverse().slice(0, 6);
        const stanceOf = (iso) => { try { const u = sanmeiUn(birth, iso); return u && u.day ? u.day : null; } catch { return null; } };
        return html`<div style=${{ ...card }}>
          <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
            <span style=${{ fontSize: 16, fontWeight: 800, color: C.green }}>📔 今日のスレッド</span>

          <div style=${{ fontSize: 13, color: C.sub, marginBottom: 10, lineHeight: 1.6 }}>今日の気分にリアクション＋ひとこと。続けるほど“あなたの記録”が育ちます。</div>
          <${MoodPicker} key=${`today|${jv}`} dateISO=${todayISO} onSaved=${onSaved} />

                    ${e.note ? html`<div style=${{ fontSize: 13.5, color: C.text, lineHeight: 1.6, wordBreak: "break-word" }}>${e.note}</div>` : html`<div style=${{ fontSize: 13, color: C.faint }}>（気分のみ）</div>`}

      // ── 週次コーチング・カード ──
      const COACH_Q = [
        "ここで今週、小さく一歩踏み出すとしたら？", "この分野で、今週やめてみたいことは？",
        "ここで今週、誰に何を伝えますか？", "この分野で、今週“整えたい”一つは？",
        "ここで今週、勇気を出して始めることは？",
      ];
      function Coaching({ natal, transit }) {
        const wk = mondayKey();
        const sI = (l) => Math.floor((((l % 360) + 360) % 360) / 30);
        const ascSign = natal && natal.ascDeg != null ? sI(natal.ascDeg) : 0;
        const sunHouse = (transit && transit.lons && transit.lons.太陽 != null) ? ((sI(transit.lons.太陽) - ascSign + 12) % 12) + 1 : 1;
        const init = () => { const o = loadCoach(); return o.key === wk ? o : { key: wk, focus: sunHouse, commit: "", done: false, total: o.total || 0 }; };
        const [data, setData] = useState(init);
        const [draft, setDraft] = useState(data.commit || "");
        const persist = (next) => { setData(next); saveCoach(next); };
        const q = COACH_Q[(data.focus + new Date().getDate()) % COACH_Q.length];
        return html`<div style=${{ background: `linear-gradient(135deg, ${C.accent}22, ${C.panel})`, border: `1px solid ${C.accent}`, borderRadius: 16, padding: 16, marginBottom: 14 }}>

          </div>

          ${!data.commit ? html`<div>
            <input value=${draft} onInput=${(e) => setDraft(e.target.value)} placeholder="わたしの宣言（今週やる一つ）" style=${{ ...inp, marginBottom: 8 }} />
            <button onClick=${() => { if (draft.trim()) persist({ ...data, commit: draft.trim() }); }} style=${{ ...inp, marginBottom: 0, background: C.accent, color: C.onAccent, fontWeight: 700, border: "none", cursor: "pointer" }}>宣言する</button>
          </div>` : html`<div>
            <div style=${{ background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 10, padding: "10px 12px", fontSize: 14, color: C.text, marginBottom: 8 }}>📌 ${data.commit}</div>

                <button onClick=${() => persist({ ...data, done: true, total: (data.total || 0) + 1 })} style=${{ ...inp, marginBottom: 0, flex: 1, background: C.green, color: C.onAccent, fontWeight: 700, border: "none", cursor: "pointer" }}>できた！✅</button>
                <button onClick=${() => persist({ ...data, commit: "" })} style=${{ ...inp, marginBottom: 0, width: 84, background: C.panel2, color: C.sub, border: `1px solid ${C.line}`, cursor: "pointer" }}>書き直す</button>
              </div>`}
          </div>`}
        </div>`;
      }

      // ── 今日のヒーロー（毎日開く動機・最上部に常設）──
      const WD_JP = ["日", "月", "火", "水", "木", "金", "土"];
      function TodayHero({ un, visit, name, celebrate, apiKey, context, birth, dailyOracle }) {
        const d = un.day;
        const col = stanceColor(d.stance);
        const lucky = luckyOf(un);
        const [msg, setMsg] = useState("");
        const now = new Date();
        const dateLabel = `${now.getMonth() + 1}月${now.getDate()}日(${WD_JP[now.getDay()]})`;
        const todayISO = ymd(now);
        const seed = birth ? `${birth.date}|${birth.time}|${birth.place}` : "";
        const tip = dailyTip(todayISO, seed);

        // AI「今日の一言」：鍵があり設定ONなら、1日1回だけ生成してキャッシュ
        const aiOn = aiReady(apiKey) && dailyOracle !== false;
        const [aiText, setAiText] = useState(() => (aiOn ? getDailyAI(seed, todayISO) : ""));
        const [aiBusy, setAiBusy] = useState(false);
        const genDaily = async (force) => {
          if (!aiOn || aiBusy) return;
          if (!force) { const c = getDailyAI(seed, todayISO); if (c) { setAiText(c); return; } }
          setAiBusy(true);
          try {
            const sys = `あなたは相談者の専属占術師です。下の命式を踏まえ、今日この人に向けた“今日だけの具体的な一言”を、前向きに、的を1つに絞って日本語2文以内で。占い用語は噛み砕く。挨拶や前置きは不要。\n# 命式\n${context || ""}`;
            const user = `今日は${dateLabel}。日の干支は${d.ganzhi}（重なる星：${d.star}／気のスタンス：${d.stance}）。この人の今日の過ごし方を2文以内で。`;
            const t = await callAI(sys, [{ role: "user", content: user }], apiKey);
            if (t) { setAiText(t); setDailyAI(seed, todayISO, t); }
          } catch (e) { /* 失敗時は決定論ヒントで代替 */ } finally { setAiBusy(false); }
        };
        useEffect(() => { if (aiOn && !aiText) genDaily(false); }, []);
        const onShare = async () => {
          const luckyLine = lucky ? `\nラッキー：${lucky.color}／${lucky.dir}の方角` : "";
          const text = `【命式ノート】${dateLabel}の運氣：${d.star}・${d.stance}\n${d.move}${luckyLine}`;
          const r = await shareApp(text);
          if (r === "copied") { setMsg("リンクをコピーしました"); setTimeout(() => setMsg(""), 2200); }
          else if (r === "fail") { setMsg("共有できませんでした"); setTimeout(() => setMsg(""), 2200); }
        };
        const chip = (label, val) => html`<div style=${{ background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 10, padding: "5px 9px", fontSize: 12, color: C.sub, lineHeight: 1.3 }}>${label}<br /><b style=${{ color: C.text, fontSize: 13 }}>${val}</b></div>`;
        return html`<div style=${{ background: `linear-gradient(135deg, ${col}26, ${C.panel})`, border: `1px solid ${col}`, borderRadius: 16, padding: 16, marginBottom: 14 }}>
          <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
            <span style=${{ fontSize: 12, color: C.sub }}>🌙 ${dateLabel} の運氣${name ? `・${name} さん` : ""}</span>
            ${visit && visit.streak > 1 && html`<span style=${{ fontSize: 12, fontWeight: 700, color: C.accent }}>🔥 ${visit.streak}日連続${visit.best > visit.streak ? `（最高${visit.best}）` : ""}</span>`}
          </div>
          ${celebrate > 0 && html`<div style=${{ background: C.accent + "22", border: `1px solid ${C.accent}`, borderRadius: 10, padding: "7px 10px", marginBottom: 8, fontSize: 13, fontWeight: 700, color: C.accent, textAlign: "center" }}>🎉 ${celebrate}日連続 達成！この調子で続けましょう</div>`}
          ${(aiText || aiBusy) && html`<div style=${{ background: C.panel2, border: `1px solid ${C.purple}55`, borderRadius: 12, padding: "10px 12px", marginBottom: 10 }}>
            <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: aiText ? 4 : 0 }}>
              <span style=${{ fontSize: 12, fontWeight: 700, color: C.purple }}>🔮 今日の一言</span>
              ${aiText && !aiBusy && html`<button onClick=${() => genDaily(true)} title="別の言い方で" style=${{ background: "none", border: "none", color: C.faint, fontSize: 12, cursor: "pointer" }}>🔄 別の言い方</button>`}
            </div>
            ${aiBusy ? html`<span style=${{ fontSize: 13, color: C.faint }}>占っています…</span>` : html`<div style=${{ fontSize: 14, lineHeight: 1.7, color: C.text, whiteSpace: "pre-wrap" }}>${aiText}</div>`}
          </div>`}
          <div style=${{ fontSize: 20, fontWeight: 800, color: col, marginBottom: 4 }}>${d.emoji} ${d.star} ・ ${d.stance}（${d.ganzhi}）</div>
          <div style=${{ fontSize: 14, lineHeight: 1.7, color: C.text, marginBottom: 10 }}>${d.move}</div>
          <div style=${{ background: col + "14", borderLeft: `3px solid ${col}`, borderRadius: 6, padding: "9px 12px", marginBottom: 10, fontSize: 13.5, lineHeight: 1.7, color: C.text }}>👉 <b>今日の一手</b>：${STANCE_ACT[d.stance] || ""}${lucky ? `${lucky.action}を意識すると追い風。` : ""}<br /><span style=${{ color: C.faint, fontSize: 12.5 }}>🌱 ${tip}</span></div>
          ${lucky && html`<div style=${{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 6, marginBottom: 10 }}>
            <div style=${{ background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 10, padding: "5px 9px", fontSize: 12, color: C.sub, lineHeight: 1.3 }}>ラッキー色<br /><span style=${{ display: "inline-flex", alignItems: "center", gap: 4 }}><span style=${{ width: 10, height: 10, borderRadius: 3, background: lucky.hex, display: "inline-block" }}></span><b style=${{ color: C.text, fontSize: 13 }}>${lucky.color}</b></span></div>
            ${chip("方角", lucky.dir)}
            ${chip("時間帯", lucky.time)}
            ${chip("吉な行動", lucky.action)}
          </div>`}
          <div style=${{ display: "flex", alignItems: "center", gap: 10 }}>
            <button onClick=${onShare} style=${{ background: C.panel2, border: `1px solid ${C.line}`, color: C.text, borderRadius: 999, padding: "6px 14px", fontSize: 13, cursor: "pointer" }}>🔗 今日の運氣をシェア</button>
            ${msg && html`<span style=${{ fontSize: 12, color: C.green }}>${msg}</span>`}
          </div>
        </div>`;
      }

      // ── 初回オンボーディング（価値訴求＋サンプル体験で初回離脱を防ぐ）──
      function Onboarding({ onSample }) {
        const items = [["🗓", "毎日の運氣と占術カレンダーで“今日の動き方”がわかる"], ["🧭", "あなたの性質・才能・人生の流れ（人体星図・大運）"], ["💞", "相性診断と、AI占い師への相談"]];
        return html`<div style=${{ background: `linear-gradient(135deg, ${C.purple}26, ${C.panel})`, border: `1px solid ${C.purple}`, borderRadius: 16, padding: 18, marginBottom: 14 }}>

          <div style=${{ fontSize: 13, color: C.sub, lineHeight: 1.8, marginBottom: 10 }}>生年月日を入れるだけで、算命学・四柱推命・西洋＆インド占星術をまとめて自前計算します。</div>

          <button onClick=${onSample} style=${{ marginTop: 10, width: "100%", background: C.purple, color: C.onAccent, border: "none", borderRadius: 10, padding: "11px", fontSize: 15, fontWeight: 700, cursor: "pointer" }}>まずはサンプルで体験する</button>
          <div style=${{ fontSize: 12, color: C.faint, textAlign: "center", marginTop: 6 }}>↓ 下の「生年月日の入力」に自分の情報を入れてもOK</div>
        </div>`;
      }

      // ── ホーム画面に追加の案内（PWAインストール導線・1回閉じたら出さない）──
      const INSTALL_TIP_STORE = "meishiki-note:installtip:v1";
      function InstallTip() {
        const [show, setShow] = useState(() => {
          try { if (isStandalone()) return false; if (localStorage.getItem(INSTALL_TIP_STORE) === "1") return false; } catch {}
          return true;

        if (!show) return null;
        const dismiss = () => { try { localStorage.setItem(INSTALL_TIP_STORE, "1"); } catch {} setShow(false); };
        return html`<div style=${{ ...card, borderStyle: "dashed" }}>
          <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>

            </div>

      // ── 保存できない環境向けの脱出導線（URLコピー）──
      function StorageWarning() {
