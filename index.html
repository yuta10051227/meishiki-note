<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1115" />
    <meta name="description" content="生年月日から算命学・四柱推命・西洋＆インド占星術を自前計算。毎日の運氣・占術カレンダー・AI相談。" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="命式ノート" />
    <title>命式ノート — 算命学・四柱推命・占星術</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #0F1115; color: #E8EAED; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-text-size-adjust: 100%; }
      * { box-sizing: border-box; }
      #root:empty::after { content: "読み込み中…"; display: grid; place-items: center; height: 100%; color: #9AA1AC; font-size: 14px; }
      input, select, button { font-family: inherit; }
    </style>
    <script>
      // 起動エラーを画面に出す（白画面防止）
      window.addEventListener("error", function (e) {
        var r = document.getElementById("root");
        if (!r || r.childElementCount > 0) return;
        var msg = (e.error && e.error.stack) || e.message || "読み込みエラー";
        if (/extension:\/\//.test(String(msg))) return;
        r.innerHTML = "<div style='padding:20px;font-size:13px;color:#9AA1AC'><b style='color:#E2554B'>読み込みの問題</b><pre style='white-space:pre-wrap;background:#171A21;padding:12px;border-radius:8px'>" + String(msg) + "</pre>（初回はネット接続が必要です。esm.sh から React と計算ライブラリを読み込みます。一度開けば次回からオフラインでも起動します）</div>";
      }, true);
      // PWA: Service Worker を登録（オフライン起動・ホーム画面追加用）。相対パスで配信先サブパスに追従。
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { useState, useMemo, useEffect } from "https://esm.sh/react@18.3.1";
      import { createRoot } from "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1";
      import htm from "https://esm.sh/htm@3.1.1";
      import {
        sanmeiDetail, sanmeiUn, tenchusatsu, daiun, aishou, computeChart, advisor, stancesFor,
      } from "./natal.js";

      const html = htm.bind(React.createElement);

      // 配色テーマ（ダーク/ライト）。onAccent = 色付きボタン上の文字色。
      const THEMES = {
        dark: {
          bg: "#0F1115", panel: "#171A21", panel2: "#1E222B", line: "#2A2F3A",
          text: "#E8EAED", sub: "#9AA1AC", faint: "#7A828E",
          purple: "#9B8CFF", green: "#3FB984", blue: "#5B8DEF", accent: "#C9A227", red: "#E2554B",
          onAccent: "#0B0D11",
        },
        light: {
          bg: "#F4F6F9", panel: "#FFFFFF", panel2: "#EEF1F5", line: "#D7DCE3",
          text: "#1B1F26", sub: "#566072", faint: "#8A94A3",
          purple: "#6C5CE7", green: "#1E9E6A", blue: "#2F6FE0", accent: "#B8860B", red: "#D23B30",
          onAccent: "#FFFFFF",
        },
      };
      const THEME_STORE = "meishiki-note:theme";
      const loadTheme = () => { try { return localStorage.getItem(THEME_STORE) === "light" ? "light" : "dark"; } catch { return "dark"; } };
      // C / inp / card は let（ライブバインディング）。テーマ変更時に作り直して全体に反映。
      let C = THEMES[loadTheme()] || THEMES.dark;
      let inp, card;
      const rebuildStyles = () => {
        inp = { width: "100%", padding: "11px 12px", marginBottom: 10, background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 10, color: C.text, fontSize: 15 };
        card = { background: C.panel, border: `1px solid ${C.line}`, borderRadius: 14, padding: 16, marginBottom: 14 };
      };
      const applyBodyTheme = () => { try { document.body.style.background = C.bg; document.body.style.color = C.text; } catch {} };
      const applyTheme = (mode) => {
        C = THEMES[mode] || THEMES.dark;
        rebuildStyles(); applyBodyTheme();
        try { localStorage.setItem(THEME_STORE, mode); } catch {}
      };
      rebuildStyles(); applyBodyTheme();

      // 出生地（47都道府県の県庁所在地・緯度経度）。真太陽時の地方時補正に使用。
      const PLACES = [
        ["北海道", 43.06, 141.35], ["青森", 40.82, 140.74], ["岩手", 39.70, 141.15],
        ["宮城", 38.27, 140.87], ["秋田", 39.72, 140.10], ["山形", 38.24, 140.36],
        ["福島", 37.75, 140.47], ["茨城", 36.34, 140.45], ["栃木", 36.57, 139.88],
        ["群馬", 36.39, 139.06], ["埼玉", 35.86, 139.65], ["千葉", 35.61, 140.12],
        ["東京", 35.69, 139.69], ["神奈川", 35.45, 139.64], ["新潟", 37.90, 139.02],
        ["富山", 36.70, 137.21], ["石川", 36.59, 136.63], ["福井", 36.07, 136.22],
        ["山梨", 35.66, 138.57], ["長野", 36.65, 138.18], ["岐阜", 35.39, 136.72],
        ["静岡", 34.98, 138.38], ["愛知", 35.18, 136.91], ["三重", 34.73, 136.51],
        ["滋賀", 35.00, 135.87], ["京都", 35.02, 135.76], ["大阪", 34.69, 135.50],
        ["兵庫", 34.69, 135.20], ["奈良", 34.69, 135.83], ["和歌山", 34.23, 135.17],
        ["鳥取", 35.50, 134.24], ["島根", 35.47, 133.05], ["岡山", 34.66, 133.93],
        ["広島", 34.40, 132.46], ["山口", 34.19, 131.47], ["徳島", 34.07, 134.56],
        ["香川", 34.34, 134.05], ["愛媛", 33.84, 132.77], ["高知", 33.56, 133.53],
        ["福岡", 33.61, 130.42], ["佐賀", 33.25, 130.30], ["長崎", 32.74, 129.87],
        ["熊本", 32.79, 130.74], ["大分", 33.24, 131.61], ["宮崎", 31.91, 131.42],
        ["鹿児島", 31.56, 130.56], ["沖縄", 26.21, 127.68],
      ];

      // 入力（生年月日など）は端末内の localStorage にのみ保存。外部送信はしない。
      // v2: 複数プロフィールをリストで保持し、名前で切り替えられる。
      const STORE_KEY = "meishiki-note:v2";
      const DEFAULT_FORM = { name: "", date: "", time: "", gender: "", place: "東京", memo: "" };
      const newId = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const labelOf = (p) => (p && (p.name || p.date)) || "無題";
      const loadStore = () => {
        try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if (s && Array.isArray(s.profiles)) return s; } catch {}
        // 旧 v1（単一保存）からの移行
        try { const v1 = JSON.parse(localStorage.getItem("meishiki-note:v1") || "null"); if (v1 && v1.date) { const id = newId(); return { profiles: [{ id, ...DEFAULT_FORM, ...v1 }], currentId: id }; } } catch {}
        return { profiles: [], currentId: null };
      };
      const saveStore = (s) => { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch {} };
      // この端末/ブラウザで localStorage が実際に使えるか（プライベートブラウズ等の検出）
      const STORAGE_OK = (() => {
        try { const k = "__meishiki_test"; localStorage.setItem(k, "1"); const v = localStorage.getItem(k); localStorage.removeItem(k); return v === "1"; } catch { return false; }
      })();
      // フォーム入力から鑑定用の birth オブジェクトを組み立てる（出生地→緯度経度を解決）。
      const buildBirth = (f) => {
        if (!f || !f.date) return null;
        const p = PLACES.find((x) => x[0] === f.place) || PLACES[0];
        return { name: (f.name || "").trim(), date: f.date, time: f.time || "12:00", timeKnown: !!f.time, gender: f.gender || "", place: f.place || PLACES[0][0], lat: p[1], lon: p[2], utcOffset: 9, memo: (f.memo || "").trim() };
      };

      // ── AI占い師チャット（自分専用・ブラウザから Google Gemini を直接呼ぶ）──
      // APIキーはこの端末の localStorage にのみ保存。相談時のみ命式と相談文を Gemini に送信する。
      const KEY_STORE = "meishiki-note:gemini-key";
      const loadKey = () => { try { return localStorage.getItem(KEY_STORE) || ""; } catch { return ""; } };
      const saveKey = (k) => { try { localStorage.setItem(KEY_STORE, k); } catch {} };
      const clearKey = () => { try { localStorage.removeItem(KEY_STORE); } catch {} };

      // ── 連続来訪ストリーク（毎日開く動機づけ・習慣化）──
      const VISIT_STORE = "meishiki-note:visit:v1";
      const ymd = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
      const loadVisit = () => { try { return JSON.parse(localStorage.getItem(VISIT_STORE) || "null") || {}; } catch { return {}; } };
      // 来訪を記録し、ストリーク情報 { streak, best, days, last } を返す（1日1回だけ加算）
      const touchVisit = () => {
        const today = ymd(new Date());
        const yest = ymd(new Date(Date.now() - 86400000));
        const v = loadVisit();
        if (v.last !== today) {
          v.streak = v.last === yest ? (v.streak || 0) + 1 : 1;
          v.days = (v.days || 0) + 1;
          v.last = today;
        }
        v.streak = v.streak || 1;
        v.best = Math.max(v.best || 0, v.streak);
        try { localStorage.setItem(VISIT_STORE, JSON.stringify(v)); } catch {}
        return v;
      };

      // ── 共有（再来訪・口コミ導線）。Web Share→無ければクリップボード。──
      const shareApp = async (text) => {
        const url = location.href;
        try { if (navigator.share) { await navigator.share({ title: "命式ノート", text, url }); return "shared"; } } catch (e) { if (String(e && e.name) === "AbortError") return "shared"; }
        try { await navigator.clipboard.writeText(`${text}\n${url}`); return "copied"; } catch {}
        return "fail";
      };
      const copyUrl = async () => { try { await navigator.clipboard.writeText(location.href); return true; } catch { return false; } };
      // スタンドアロン（ホーム画面から起動）判定
      const isStandalone = () => {
        try { return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true; } catch { return false; }
      };
      const isIOS = () => { try { return /iphone|ipad|ipod/i.test(navigator.userAgent); } catch { return false; } };

      // ── 日々の記録（気分ログ）：データ蓄積でスイッチングコストを生み継続を強める ──
      const JOURNAL_STORE = "meishiki-note:journal:v1";
      const loadJournal = () => { try { return JSON.parse(localStorage.getItem(JOURNAL_STORE) || "{}") || {}; } catch { return {}; } };
      const getEntry = (iso) => loadJournal()[iso] || null;
      const saveEntry = (iso, entry) => {
        const j = loadJournal();
        if (entry && (entry.mood || (entry.note || "").trim())) j[iso] = { mood: entry.mood || 0, note: (entry.note || "").trim() };
        else delete j[iso];
        try { localStorage.setItem(JOURNAL_STORE, JSON.stringify(j)); } catch {}
        return j;
      };
      const journalCount = () => Object.keys(loadJournal()).length;
      const MOODS = [[1, "😣"], [2, "😕"], [3, "😐"], [4, "🙂"], [5, "😄"]];
      const moodEmoji = (m) => { const f = MOODS.find((x) => x[0] === m); return f ? f[1] : ""; };

      // ── ストリークのマイルストーン（損失回避＋達成感で継続を後押し）──
      const MILESTONE_STORE = "meishiki-note:milestone:v1";
      const MILESTONES = [3, 7, 14, 30, 50, 100, 200, 365];
      const checkMilestone = (streak) => {
        const reached = MILESTONES.filter((n) => streak >= n).pop() || 0;
        let last = 0; try { last = parseInt(localStorage.getItem(MILESTONE_STORE) || "0", 10) || 0; } catch {}
        if (reached > last) { try { localStorage.setItem(MILESTONE_STORE, String(reached)); } catch {} return reached; }
        return 0;
      };

      // ── 今日のラッキー（五行ベースの日替わりコンテンツ：新鮮さ＝戻る理由）──
      const STEM_ELEM = { 甲: "木", 乙: "木", 丙: "火", 丁: "火", 戊: "土", 己: "土", 庚: "金", 辛: "金", 壬: "水", 癸: "水" };
      const LUCKY_BY_ELEM = {
        木: { color: "緑", hex: "#36B37E", dir: "東", action: "新しいことを始める・企画する" },
        火: { color: "赤・オレンジ", hex: "#E2554B", dir: "南", action: "発信する・人と会う・表現する" },
        土: { color: "黄・ベージュ", hex: "#C9A227", dir: "南西", action: "整理する・信頼を積む・基盤づくり" },
        金: { color: "白・金", hex: "#C9CDD6", dir: "西", action: "決断する・仕上げる・手放す" },
        水: { color: "青・黒", hex: "#5B8DEF", dir: "北", action: "学ぶ・情報収集・休んで充電" },
      };
      const BRANCH_TIME = { 子: "23〜1時", 丑: "1〜3時", 寅: "3〜5時", 卯: "5〜7時", 辰: "7〜9時", 巳: "9〜11時", 午: "11〜13時", 未: "13〜15時", 申: "15〜17時", 酉: "17〜19時", 戌: "19〜21時", 亥: "21〜23時" };
      const luckyOf = (un) => {
        if (!un || !un.day) return null;
        const elem = STEM_ELEM[un.day.stem] || "土";
        const branch = String(un.day.ganzhi || "").slice(-1);
        return { ...LUCKY_BY_ELEM[elem], elem, time: BRANCH_TIME[branch] || "—" };
      };

      // ── 「今日の小さな一歩」：日付＋本人で変わる具体ヒント（固定文の使い回し感を解消）──
      // 占い用語を避けた行動プロンプト。毎日違う・人によっても違う。オフライン/鍵なしでも新鮮。
      const DAILY_TIPS = [
        "未読のままの連絡に、ひとつだけ返信してみる。", "机の上を5分だけ片づけると、頭も軽くなる日。",
        "いつもの道を一本ずらして歩く。小さな発見がヒントに。", "「ありがとう」を一度、声に出して伝えてみる。",
        "やめたいことを一つ、今日だけ休んでみる。", "気になっていた人に、こちらから一言かけてみる。",
        "5分の散歩で、考えごとが整理される日。", "やることリストの一番上だけ、先に片づける。",
        "水を一杯多めに。体が整うと判断も冴える。", "完璧を狙わず、7割で出してみる。",
        "昔のメモや写真を見返すと、次の一手が見える。", "断る勇気が、今日は良い結果を呼ぶ。",
        "小さな出費を一つ見直してみる。", "背筋を伸ばして深呼吸を3回。流れが変わる。",
        "今日会う人の良いところを、心の中で一つ挙げる。", "先延ばしの連絡を、今日こそ一通。",
        "新しい店・新しい味に挑戦してみる日。", "10分早く寝る準備を。明日の自分への贈り物。",
        "迷ったら、ワクワクする方を選んでみる。", "誰かに小さな頼みごとをしてみる。頼り上手の日。",
        "苦手な作業を、最初の5分だけやってみる。", "今日の予定を一つ減らして、余白をつくる。",
        "目についた場所を一か所だけ磨く。運気の通り道に。", "感謝のメッセージを一通送る。",
        "結論を急がず、一晩寝かせると吉。", "身につける色を、いつもと変えてみる。",
        "古いものを一つ手放すと、新しい流れが来る。", "声のトーンを少し上げて話してみる。",
        "今日は聞き役に回ると、思わぬ情報が入る。", "短くてもいいので、外の空気を吸う。",
        "やりたかったことを、5分だけ始めてみる。", "お金の話は、数字を見てから決める。",
        "笑える動画を一本。緊張がほどけて巡りが良くなる。", "今日の自分を、小さく一つほめる。",
        "連絡先を整理すると、人間関係も軽くなる。", "甘いものは少なめ、温かいものを選ぶと吉。",
        "一人の時間を15分つくって、頭を休める。", "気になる学びを、検索一回だけしてみる。",
        "約束は早めに確認。すれ違いを防げる日。", "姿勢よく、いつもよりゆっくり歩く。",
      ];
      const strHash = (s) => { let h = 0; for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return Math.abs(h); };
      const dailyTip = (dateISO, seed) => DAILY_TIPS[strHash(`${dateISO}|${seed || ""}`) % DAILY_TIPS.length];

      // ── AI「今日の一言」：本人の命式×今日の干支で毎日ユニークに生成。1日1回キャッシュ。──
      const DAILY_AI_STORE = "meishiki-note:dailyai:v1";
      const getDailyAI = (pkey, iso) => { try { const e = (JSON.parse(localStorage.getItem(DAILY_AI_STORE) || "{}") || {})[pkey]; return e && e.date === iso ? e.text : ""; } catch { return ""; } };
      const setDailyAI = (pkey, iso, text) => { try { const o = JSON.parse(localStorage.getItem(DAILY_AI_STORE) || "{}") || {}; o[pkey] = { date: iso, text }; localStorage.setItem(DAILY_AI_STORE, JSON.stringify(o)); } catch {} };

      // ── カスタマイズ設定（端末内に保存）──
      const SETTINGS_STORE = "meishiki-note:settings:v1";
      const DEFAULT_SECTIONS = { natal: true, wforecast: true, love: true, life: true, advisor: true, chat: true, calendar: true, jintai: true, un: true, unsei: true, aishou: true, astro: true };
      const DEFAULT_SETTINGS = { tone: "gentle", oracleName: "", replyLength: "normal", dailyOracle: true, sections: { ...DEFAULT_SECTIONS } };
      const loadSettings = () => {
        try {
          const s = JSON.parse(localStorage.getItem(SETTINGS_STORE) || "null") || {};
          return { ...DEFAULT_SETTINGS, ...s, sections: { ...DEFAULT_SECTIONS, ...(s.sections || {}) } };
        } catch { return { ...DEFAULT_SETTINGS, sections: { ...DEFAULT_SECTIONS } }; }
      };
      const saveSettings = (s) => { try { localStorage.setItem(SETTINGS_STORE, JSON.stringify(s)); } catch {} };
      // 占い師の口調・回答の長さプリセット（システムプロンプトに反映）
      const TONE_PROMPTS = {
        gentle: "やさしく寄り添う、穏やかで丁寧な口調で話す。",
        friendly: "親しみやすいフレンドリーなタメ口で、距離感近めに話す。",
        blunt: "歯に衣着せずズバッと辛口で指摘する。ただし最後は必ず前向きに背中を押す。",
        polite: "上品で格調高い、敬語の丁寧な口調で話す。",
      };
      const TONE_LABELS = { gentle: "やさしい", friendly: "フレンドリー(タメ口)", blunt: "辛口ズバッと", polite: "丁寧・上品" };
      const LENGTH_PROMPTS = { short: "回答は短く要点だけ（2〜3文）。", normal: "回答は適度な長さで。", long: "回答は具体例を交えてやや詳しめに。" };
      const LENGTH_LABELS = { short: "短め", normal: "標準", long: "詳しめ" };

      // 命式・算命学の読みを「鑑定の根拠」テキストにまとめる（システムプロンプトに渡す）
      function buildOracleContext(data, birth) {
        const lines = [];
        if (birth && birth.name) lines.push(`相談者: ${birth.name} さん`);
        if (data.chart && data.chart.text) lines.push(data.chart.text);
        const d = data.detail;
        if (d) {
          if (d.center) lines.push(`算命学・中心星（本質）: ${d.center.star}（${d.center.title}）— ${d.center.desc}`);
          if (d.dayType) lines.push(`日干タイプ: ${d.dayType.label} — ${d.dayType.desc}`);
        }
        const a = data.advisor;
        if (a) {
          if (a.fiveElements) lines.push(`五行バランス: 強「${a.fiveElements.strong}」／弱「${a.fiveElements.weak}」`);
          const fmt = (x) => `${x.headline}｜${(x.points || []).join(" / ")}`;
          if (a.business) lines.push(`【ビジネス】${fmt(a.business)}`);
          if (a.love) lines.push(`【人間関係】${fmt(a.love)}`);
          if (a.health) lines.push(`【健康】${fmt(a.health)}`);
          if (a.today) lines.push(`【今日】${fmt(a.today)}`);
        }
        if (birth && birth.memo) lines.push(`相談者からの補足メモ（重視して反映）: ${birth.memo}`);
        return lines.join("\n");

      // Google Gemini API をブラウザから直接呼ぶ（無料枠・自分専用前提）
      const GEMINI_MODEL = "gemini-2.5-flash";
      async function callGemini(apiKey, system, messages) {
        // Gemini のロールは user / model（assistant→model に変換）
        const contents = messages.map((m) => ({
          role: m.role === "assistant" ? "model" : "user",
          parts: [{ text: m.content }],
        }));
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const res = await fetch(url, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: system }] },
            contents,
            generationConfig: {
              maxOutputTokens: 2048,
              temperature: 0.9,
              // Gemini 2.5 は思考モデル。思考が出力枠を食って回答が途中で切れるのを防ぐため思考を無効化。
              thinkingConfig: { thinkingBudget: 0 },
            },
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const msg = (data && data.error && data.error.message) || `エラー (HTTP ${res.status})`;
          throw new Error(msg);
        }
        const cand = (data.candidates || [])[0];
        if (!cand) {
          const br = data.promptFeedback && data.promptFeedback.blockReason;
          throw new Error(br ? `安全フィルタによりブロックされました（${br}）` : "回答が空でした");
        }
        const text = ((cand.content && cand.content.parts) || []).map((p) => p.text || "").join("").trim();
        if (!text) {
          const fr = cand.finishReason;
          throw new Error(fr && fr !== "STOP" ? `回答が途中で停止しました（${fr}）` : "回答が空でした");
        }
        return text;
      }

        let age = 0; try { age = (Date.now() - new Date(birth.date + "T12:00:00").getTime()) / (365.25 * 86400000); } catch {}
        const RET = [29.5, 58.5, 88]; const nextRet = RET.find((a) => a > age) || RET[RET.length - 1];
        const retYear = birth && birth.date ? new Date(birth.date).getFullYear() + Math.round(nextRet) : null;
        const tabs = [["day", "☽ 今日"], ["month", "☀ 今月"], ["year", "♃ 今年"], ["fate", "✦ 運命"]];
        const block = (col, head, body, note) => html`<div style=${{ background: C.panel2, border: `1px solid ${col}`, borderRadius: 12, padding: 13 }}>
          <div style=${{ fontSize: 14, fontWeight: 700, color: col, marginBottom: 6 }}>${head}</div>
          <div style=${{ fontSize: 13, lineHeight: 1.8, color: C.text }}>${body}</div>
          ${note && html`<div style=${{ fontSize: 11, color: C.faint, marginTop: 6 }}>${note}</div>`}
        </div>`;
        const row = (e, label, text) => html`<div style=${{ marginBottom: 5 }}><b>${e} ${label}：</b>${text}</div>`;
        let content;
        if (tab === "day") {
          const s = sIdx(L.月), h = hOf(L.月), col = elemCol(s);
          content = block(col, `☽ 今日：月が${signN(s)}・あなたの${houseN(h)}へ`,
            html`今日は<b style=${{ color: col }}>${HOUSE_INFO[h - 1][0]}</b>に光が当たる日。${HOUSE_INFO[h - 1][1]} 心のモードは「${SIGN_INFO[s][3]}」——${SIGN_INFO[s][4]}`,
            "月は約2.5日で星座を移動。毎日テーマが変わります。");
        } else if (tab === "month") {
          const s = sIdx(L.太陽), h = hOf(L.太陽), col = elemCol(s);
          content = block(col, `☀ 今月：太陽が${signN(s)}・あなたの${houseN(h)}を巡る`,
            html`今月は<b style=${{ color: col }}>${HOUSE_INFO[h - 1][0]}</b>にエネルギーが集まる時期。${HOUSE_INFO[h - 1][1]} ここに時間と意識を注ぐと流れに乗れます。`,
            "太陽は約1か月で星座を移動。月単位のテーマです。");
        } else if (tab === "year") {
          const jh = hOf(L.木星), sh = hOf(L.土星), js = sIdx(L.木星), ss = sIdx(L.土星);
          content = html`<div style=${{ display: "flex", flexDirection: "column", gap: 10 }}>
            ${block(C.green, `♃ 今年の追い風：木星が${signN(js)}・${houseN(jh)}`,
              html`<b style=${{ color: C.green }}>${HOUSE_INFO[jh - 1][0]}</b>が拡大・チャンスのテーマ。${HOUSE_INFO[jh - 1][1]} ここは思いきって広げると吉。`,
              "木星は約1年で星座を移動。1年の幸運の方向。")}
            ${block(C.blue, `♄ 今年の課題：土星が${signN(ss)}・${houseN(sh)}`,
              html`<b style=${{ color: C.blue }}>${HOUSE_INFO[sh - 1][0]}</b>で責任・努力が問われ、乗り越えると実力と信頼に変わる領域。`,
              "土星は約2.5年で星座を移動。鍛えられるテーマ。")}
          </div>`;
        } else {
          const ns = sIdx(N.太陽), nh = hOf(N.太陽), mc = sIdx(norm360(natal.mcDeg)), col = elemCol(ns);
          content = block(C.purple, "✦ あなたの運命のテーマ（出生図より）",
            html`${row("🌞", "人生の目的", html`太陽 <b style=${{ color: col }}>${SIGN_INFO[ns][0]}座</b>＝${SIGN_INFO[ns][3]}`)}
              ${row("🌅", "生き方の入口(ASC)", html`<b style=${{ color: C.purple }}>${SIGN_INFO[ascSign][0]}座</b>＝${SIGN_INFO[ascSign][3]}`)}
              ${row("🏔", "社会的使命(MC)", html`<b style=${{ color: C.blue }}>${SIGN_INFO[mc][0]}座</b>＝${SIGN_INFO[mc][3]}`)}
              ${row("🎭", "活躍の舞台", houseN(nh))}
              ${row("🪐", "人生の節目(土星回帰)", `約${nextRet}歳ごろ${retYear ? `（${retYear}年前後）` : ""}——生き方が問い直され、本物の土台ができる転換期。`)}`,
            "出生図に刻まれた、変わらない“持ち味と宿命”の見取り図です。");
        }
        return html`<div>
          <div style=${{ fontSize: 12, color: C.sub, marginBottom: 10, lineHeight: 1.6 }}>運行中の天体（トランジット）をあなたの出生図に重ねた、西洋占星術ベースの運勢です。</div>
          <div style=${{ display: "flex", gap: 6, marginBottom: 12, flexWrap: "wrap" }}>
            ${tabs.map(([k, label]) => { const on = tab === k; return html`<button key=${k} onClick=${() => setTab(k)} style=${{ border: `1px solid ${on ? C.purple : C.line}`, background: on ? C.purple + "22" : C.panel2, color: on ? C.purple : C.text, borderRadius: 999, padding: "6px 13px", fontSize: 13, cursor: "pointer", fontWeight: on ? 700 : 400 }}>${label}</button>`; })}
          </div>
          ${content}
        </div>`;
      }

      // ── 西洋占星術の相性（シナストリー）：2人の出生図を重ねて読む ──
      const ELEM_PAIR = (a, b) => {
        if (a === b) return 5;
        const fa = (x) => x === "火" || x === "風", ew = (x) => x === "地" || x === "水";
        if ((fa(a) && fa(b)) || (ew(a) && ew(b))) return 4;
        return 2;
      };
      const KEYPAIRS = [
        ["金星", "火星", "💘 金星 × 火星（恋愛の引力）", "ときめきと情熱が自然に通い合う、恋愛運の強い組み合わせ。", "惹かれ合うけれど刺激も強め。ペースの違いを尊重すると長続き。"],
        ["太陽", "月", "🌞🌙 太陽 × 月（安心と一体感）", "素の相手を受け止め合える、安心できる相性。", "価値観と感情のリズムが違う二人。歩み寄りが鍵。"],
        ["太陽", "太陽", "☀ 太陽 × 太陽（人生の方向）", "人生の向きが響き合い、一緒に伸びていける。", "自我がぶつかりやすいが、互いを成長させる関係。"],
        ["月", "月", "🌙 月 × 月（感情のテンポ）", "感情のテンポが合い、一緒にいて落ち着く。", "安心の条件が違う。気持ちを言葉にして共有を。"],
        ["水星", "水星", "💬 水星 × 水星（会話）", "会話と考え方が噛み合い、話していて楽しい。", "話のかみ合わせに差。聞き方を工夫すると好転。"],
      ];
      const buildSynastry = (a, b) => {
        if (!a || !b) return null;
        const sIdx = (lon) => Math.floor((((lon % 360) + 360) % 360) / 30);
        const order = ["太陽", "月", "水星", "金星", "火星"];
        let har = 0, ten = 0;
        for (const pa of order) for (const pb of order) {
          if (a[pa] == null || b[pb] == null) continue;
          const d = angDiff(a[pa], b[pb]);
          for (const asp of ASPECTS_DEF) {
            if (Math.abs(d - asp.angle) <= asp.orb) {
              if (asp.nature === "調和" || asp.nature === "強調") har++;
              else if (asp.nature === "緊張" || asp.nature === "対立") ten++;
              break;
            }
          }
        }
        const highlights = KEYPAIRS.map(([p1, p2, title, good, chall]) => {
          const cand = [];
          const tryPair = (x, y) => { if (a[x] == null || b[y] == null) return; const d = angDiff(a[x], b[y]); for (const asp of ASPECTS_DEF) { if (Math.abs(d - asp.angle) <= asp.orb) { cand.push(asp); break; } } };
          tryPair(p1, p2); if (p1 !== p2) tryPair(p2, p1);
          if (!cand.length) return null;
          const asp = cand[0], harmo = asp.nature === "調和" || asp.nature === "強調";
          return { title, asp, harmo, text: harmo ? good : chall };
        }).filter(Boolean);
        const aSun = sIdx(a.太陽), bSun = sIdx(b.太陽);
        const sunComp = ELEM_PAIR(SIGN_INFO[aSun][2], SIGN_INFO[bSun][2]);
        let score = 50 + har * 5 - ten * 3 + (sunComp - 3) * 4;
        score = Math.max(20, Math.min(98, Math.round(score)));
        const label = score >= 80 ? "とても良い相性" : score >= 60 ? "良い相性" : score >= 40 ? "努力で深まる相性" : "刺激的な相性";
        return { score, label, har, ten, highlights, aSun, bSun, aMoon: sIdx(a.月), bMoon: sIdx(b.月), aVenus: sIdx(a.金星), bVenus: sIdx(b.金星), sunComp };
      };

      function Synastry({ chart }) {
        const [b, setB] = useState({ date: "", time: "", name: "" });
        const [res, setRes] = useState(null);
        const [err, setErr] = useState("");
        const run = () => {
          setErr("");
          if (!b.date) { setErr("相手の生年月日を入れてください"); return; }
          try {
            const pc = computeChart({ date: b.date, time: b.time || "12:00", lat: 35.68, lon: 139.69, utcOffset: 9 });
            const syn = buildSynastry(chart.lons, pc.lons);
            if (!syn) { setErr("計算できませんでした"); return; }
            setRes(syn);
          } catch (e) { setErr(String(e.message || e)); }
        };
        const barCol = res ? (res.score >= 80 ? C.green : res.score >= 60 ? C.accent : res.score >= 40 ? C.blue : C.red) : C.line;
        const sg = (i) => `${SIGN_INFO[i][1]} ${SIGN_INFO[i][0]}座`;
        return html`<div>
          <div style=${{ fontSize: 12, color: C.faint, marginBottom: 8, lineHeight: 1.6 }}>相手（恋人・気になる人・友人など）の生年月日を入れると、あなたの出生図と重ねた西洋占星術の相性が出ます。時刻は分かれば。</div>
          <input placeholder="相手の名前（任意）" value=${b.name} onInput=${(e) => setB({ ...b, name: e.target.value })} style=${inp} />
          <input type="date" value=${b.date} onInput=${(e) => setB({ ...b, date: e.target.value })} style=${inp} />
          <input type="time" value=${b.time} onInput=${(e) => setB({ ...b, time: e.target.value })} style=${inp} />
          <button onClick=${run} style=${{ ...inp, background: C.purple, color: C.onAccent, fontWeight: 700, border: "none", cursor: "pointer" }}>相性を見る</button>
          ${err && html`<div style=${{ fontSize: 13, color: C.red }}>${err}</div>`}
          ${res && html`<div style=${{ marginTop: 6 }}>
            <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
              <span style=${{ fontSize: 15, fontWeight: 700 }}>${res.label}</span>
              <span style=${{ fontSize: 20, fontWeight: 800, color: barCol }}>${res.score}点</span>
            </div>
            <div style=${{ height: 8, background: C.panel2, borderRadius: 5, overflow: "hidden", border: `1px solid ${C.line}`, marginBottom: 10 }}>
              <div style=${{ width: `${res.score}%`, height: "100%", background: barCol }}></div>
            </div>
            <div style=${{ display: "flex", flexDirection: "column", gap: 4, fontSize: 13, color: C.sub, marginBottom: 10 }}>
              <div>☀ 太陽：あなた <b style=${{ color: C.text }}>${sg(res.aSun)}</b> × 相手 <b style=${{ color: C.text }}>${sg(res.bSun)}</b>（${res.sunComp >= 5 ? "同じ気質で安心" : res.sunComp >= 4 ? "気質が響き合う" : "違う気質で刺激的"}）</div>
              <div>🌙 月：あなた <b style=${{ color: C.text }}>${sg(res.aMoon)}</b> × 相手 <b style=${{ color: C.text }}>${sg(res.bMoon)}</b></div>
              <div>♀ 金星：あなた <b style=${{ color: C.text }}>${sg(res.aVenus)}</b> × 相手 <b style=${{ color: C.text }}>${sg(res.bVenus)}</b></div>
            </div>
            ${res.highlights.length > 0 && html`<div style=${{ display: "flex", flexDirection: "column", gap: 7 }}>
              ${res.highlights.map((h, i) => html`<div key=${i} style=${{ background: C.panel2, border: `1px solid ${h.harmo ? C.green : C.red}`, borderRadius: 10, padding: "9px 11px" }}>
                <div style=${{ fontSize: 13, fontWeight: 700, marginBottom: 2 }}>${h.title} <span style=${{ color: h.asp.col, fontWeight: 700 }}>${h.asp.glyph} ${h.asp.name}</span></div>
                <div style=${{ fontSize: 13, lineHeight: 1.6, color: C.sub }}>${h.text}</div>
              </div>`)}
            </div>`}
            <div style=${{ fontSize: 12, color: C.faint, marginTop: 8, lineHeight: 1.6 }}>調和の角度 ${res.har} ・ 緊張の角度 ${res.ten}（2人の太陽・月・水星・金星・火星の角度から算出）。占いとして楽しんで。</div>
          </div>`}
        </div>`;
      }

      // ── 恋愛・異性への関心（自分の出生図：金星・火星・月・DSC）──
      function Love({ chart, transit }) {
        const [open, setOpen] = useState(false);
        if (!chart || !chart.lons || chart.ascDeg == null) return html`<div style=${{ fontSize: 13, color: C.faint }}>計算できませんでした。</div>`;
        const sIdx = (lon) => Math.floor((((lon % 360) + 360) % 360) / 30);
        const v = sIdx(chart.lons.金星), m = sIdx(chart.lons.火星), mo = sIdx(chart.lons.月);
        const ascSign = sIdx(chart.ascDeg), dsc = (ascSign + 6) % 12;

        const sg = (i) => `${SIGN_INFO[i][1]} ${SIGN_INFO[i][0]}座`;
        const col = (i) => ELEM_COLOR[SIGN_INFO[i][2]];
        // 恋の運勢（運行中の金星 × 出生図）
        const lf = (() => {
          if (!transit || !transit.lons || transit.lons.金星 == null) return null;

          for (const [tn, lab] of targets) { if (chart.lons[tn] == null) continue; const d = angDiff(tv, chart.lons[tn]); for (const asp of ASPECTS_DEF) { if (Math.abs(d - asp.angle) <= asp.orb) { hits.push({ tn, lab, asp, harmo: asp.nature === "調和" || asp.nature === "強調" }); break; } } }
          return { tvS, tvH, hits };
        })();
        const card2 = (c, head, body) => html`<div style=${{ background: C.panel2, border: `1px solid ${c}`, borderRadius: 12, padding: 13, marginBottom: 10 }}>
          <div style=${{ fontSize: 14, fontWeight: 700, marginBottom: 4 }}>${head}</div>

          ${card2(col(v), html`♀ 金星 <span style=${{ color: col(v) }}>${sg(v)}</span>：愛し方・好みのタイプ`, VENUS_LOVE[v])}
          ${card2(col(m), html`♂ 火星 <span style=${{ color: col(m) }}>${sg(m)}</span>：情熱・アプローチ`, MARS_LOVE[m])}
          ${card2(col(mo), html`☽ 月 <span style=${{ color: col(mo) }}>${sg(mo)}</span>：恋人に求める安心`, html`心が満たされる関係のテーマは「${SIGN_INFO[mo][3]}」。${SIGN_INFO[mo][4]}`)}
          ${card2(C.purple, html`⬇ DSC（下降点）<span style=${{ color: C.purple }}>${sg(dsc)}</span>：惹かれる相手の傾向`, html`あなたが自然と惹かれやすいのは、<b style=${{ color: C.text }}>${SIGN_INFO[dsc][0]}座的な「${SIGN_INFO[dsc][3]}」</b>を持つ人。${SIGN_INFO[dsc][4]}`)}
          ${card2(col(v), html`🏠 金星 <span style=${{ color: C.faint, fontSize: 12 }}>第${vHouse}ハウス</span>：恋が動く場面`, html`${VENUS_HOUSE[vHouse - 1]}（${HOUSE_INFO[vHouse - 1][0]}の領域）`)}
          ${lf && html`<div style=${{ background: `linear-gradient(135deg, ${C.red}1F, ${C.panel})`, border: `1px solid ${C.red}`, borderRadius: 12, padding: 13, marginBottom: 10 }}>
            <div style=${{ fontSize: 14, fontWeight: 700, color: C.red, marginBottom: 4 }}>💫 いまの恋の運勢</div>
            <div style=${{ fontSize: 13, lineHeight: 1.8, color: C.text }}>運行中の金星が <b>${sg(lf.tvS)}・第${lf.tvH}ハウス（${HOUSE_INFO[lf.tvH - 1][0]}）</b> を通過中。${VENUS_HOUSE[lf.tvH - 1]}</div>
            ${lf.hits.length > 0 ? lf.hits.map((hh, i) => html`<div key=${i} style=${{ fontSize: 13, lineHeight: 1.7, color: C.sub, marginTop: 5 }}>${hh.harmo ? "✨" : "⚡"} 金星 <span style=${{ color: hh.asp.col, fontWeight: 700 }}>${hh.asp.glyph}${hh.asp.name}</span> あなたの${hh.tn}：${hh.harmo ? `${hh.lab}に追い風。出会い・楽しみ・告白に good な時期。` : `${hh.lab}が刺激される時期。気持ちの空回りに注意。`}</div>`)
              : html`<div style=${{ fontSize: 13, color: C.faint, marginTop: 5 }}>今は関係をじっくり育てる時期。焦らず楽しんで。</div>`}
            <div style=${{ fontSize: 11, color: C.faint, marginTop: 6 }}>金星は約3〜4週間で星座を移動。恋の追い風の方向が変わります。</div>
          </div>`}
          <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", padding: "6px 0", borderTop: `1px solid ${C.line}`, marginTop: 4 }} onClick=${() => setOpen(!open)}>
            <span style=${{ fontSize: 13, fontWeight: 700, color: C.green }}>💞 気になる人との相性も見る（おまけ）</span>
            <span style=${{ fontSize: 12, color: C.sub }}>${open ? "閉じる ▲" : "開く ▼"}</span>
          </div>
          ${open && html`<div style=${{ marginTop: 8 }}><${Synastry} chart=${chart} /></div>`}
        </div>`;
      }

      // ── 分野別の動き方・課題（出生図のハウス×サイン）──
      function LifeAreas({ chart, transit }) {
        const [sel, setSel] = useState(0);
        if (!chart || !chart.lons || chart.ascDeg == null) return html`<div style=${{ fontSize: 13, color: C.faint }}>計算できませんでした。</div>`;
        const sIdx = (lon) => Math.floor((((lon % 360) + 360) % 360) / 30);
        const ascSign = sIdx(chart.ascDeg);
        const order = ["太陽", "月", "水星", "金星", "火星", "木星", "土星"];
        const byHouse = {};
        order.forEach((n) => { if (chart.lons[n] != null) { const hh = ((sIdx(chart.lons[n]) - ascSign + 12) % 12) + 1; (byHouse[hh] = byHouse[hh] || []).push(n); } });
        // 運行中の木星・土星のハウス（今の幸運期／正念場の分野）
        const tHouse = (n) => (transit && transit.lons && transit.lons[n] != null) ? ((sIdx(transit.lons[n]) - ascSign + 12) % 12) + 1 : null;
        const jupH = tHouse("木星"), satH = tHouse("土星");
        const CATS = [["💼 仕事・キャリア", 10], ["💰 お金・才能", 2], ["💞 恋愛・楽しみ", 5], ["🤝 人間関係・パートナー", 7], ["🌿 健康・習慣", 6], ["📚 学び・挑戦", 9], ["🏠 家庭・心の基盤", 4], ["🌙 内面・癒し", 12]];
        const c = CATS[sel], houseNum = c[1], si = (ascSign + houseNum - 1) % 12, col = ELEM_COLOR[SIGN_INFO[si][2]];
        const here = byHouse[houseNum] || [];
        return html`<div>
          <div style=${{ fontSize: 12, color: C.faint, marginBottom: 10, lineHeight: 1.6 }}>各分野（ハウス）に乗るサインから動き方と課題を、運行中の<b style=${{ color: C.green }}>木星♃＝今の幸運期</b>／<b style=${{ color: C.blue }}>土星♄＝今の正念場</b>を重ねて読みます。</div>

          </div>
          <div style=${{ background: C.panel2, border: `1px solid ${col}`, borderRadius: 12, padding: 14 }}>
            <div style=${{ fontSize: 15, fontWeight: 700, marginBottom: 8 }}>${c[0]}　<span style=${{ color: C.faint, fontSize: 12 }}>第${houseNum}ハウス</span> × <span style=${{ color: col }}>${SIGN_INFO[si][1]} ${SIGN_INFO[si][0]}座</span></div>

            const t = await callGemini(apiKey, sys, [{ role: "user", content: user }]);
            if (t) { setAiText(t); setDailyAI(seed, todayISO, t); }
          } catch (e) { /* 失敗時は決定論ヒントで代替 */ } finally { setAiBusy(false); }
        };
        useEffect(() => { if (aiOn && !aiText) genDaily(false); }, []);
        const onShare = async () => {
          const luckyLine = lucky ? `\nラッキー：${lucky.color}／${lucky.dir}の方角` : "";
          const text = `【命式ノート】${dateLabel}の運氣：${d.star}・${d.stance}\n${d.move}${luckyLine}`;
          const r = await shareApp(text);
          if (r === "copied") { setMsg("リンクをコピーしました"); setTimeout(() => setMsg(""), 2200); }
          else if (r === "fail") { setMsg("共有できませんでした"); setTimeout(() => setMsg(""), 2200); }
        };
        const chip = (label, val) => html`<div style=${{ background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 10, padding: "5px 9px", fontSize: 12, color: C.sub, lineHeight: 1.3 }}>${label}<br /><b style=${{ color: C.text, fontSize: 13 }}>${val}</b></div>`;
        return html`<div style=${{ background: `linear-gradient(135deg, ${col}26, ${C.panel})`, border: `1px solid ${col}`, borderRadius: 16, padding: 16, marginBottom: 14 }}>
          <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
            <span style=${{ fontSize: 12, color: C.sub }}>🌙 ${dateLabel} の運氣${name ? `・${name} さん` : ""}</span>
            ${visit && visit.streak > 1 && html`<span style=${{ fontSize: 12, fontWeight: 700, color: C.accent }}>🔥 ${visit.streak}日連続${visit.best > visit.streak ? `（最高${visit.best}）` : ""}</span>`}
          </div>
          ${celebrate > 0 && html`<div style=${{ background: C.accent + "22", border: `1px solid ${C.accent}`, borderRadius: 10, padding: "7px 10px", marginBottom: 8, fontSize: 13, fontWeight: 700, color: C.accent, textAlign: "center" }}>🎉 ${celebrate}日連続 達成！この調子で続けましょう</div>`}
          ${(aiText || aiBusy) && html`<div style=${{ background: C.panel2, border: `1px solid ${C.purple}55`, borderRadius: 12, padding: "10px 12px", marginBottom: 10 }}>
            <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: aiText ? 4 : 0 }}>
              <span style=${{ fontSize: 12, fontWeight: 700, color: C.purple }}>🔮 今日の一言</span>
              ${aiText && !aiBusy && html`<button onClick=${() => genDaily(true)} title="別の言い方で" style=${{ background: "none", border: "none", color: C.faint, fontSize: 12, cursor: "pointer" }}>🔄 別の言い方</button>`}
            </div>
            ${aiBusy ? html`<span style=${{ fontSize: 13, color: C.faint }}>占っています…</span>` : html`<div style=${{ fontSize: 14, lineHeight: 1.7, color: C.text, whiteSpace: "pre-wrap" }}>${aiText}</div>`}
          </div>`}
          <div style=${{ fontSize: 20, fontWeight: 800, color: col, marginBottom: 4 }}>${d.emoji} ${d.star} ・ ${d.stance}（${d.ganzhi}）</div>
          <div style=${{ fontSize: 14, lineHeight: 1.7, color: C.text, marginBottom: 10 }}>${d.move}</div>
          <div style=${{ background: col + "14", borderLeft: `3px solid ${col}`, borderRadius: 6, padding: "8px 11px", marginBottom: 10, fontSize: 13, lineHeight: 1.6, color: C.text }}>🌱 今日の小さな一歩：${tip}</div>
          ${lucky && html`<div style=${{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 6, marginBottom: 10 }}>
            <div style=${{ background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 10, padding: "5px 9px", fontSize: 12, color: C.sub, lineHeight: 1.3 }}>ラッキー色<br /><span style=${{ display: "inline-flex", alignItems: "center", gap: 4 }}><span style=${{ width: 10, height: 10, borderRadius: 3, background: lucky.hex, display: "inline-block" }}></span><b style=${{ color: C.text, fontSize: 13 }}>${lucky.color}</b></span></div>
            ${chip("方角", lucky.dir)}
            ${chip("時間帯", lucky.time)}
            ${chip("吉な行動", lucky.action)}
          </div>`}
          <div style=${{ display: "flex", alignItems: "center", gap: 10 }}>
            <button onClick=${onShare} style=${{ background: C.panel2, border: `1px solid ${C.line}`, color: C.text, borderRadius: 999, padding: "6px 14px", fontSize: 13, cursor: "pointer" }}>🔗 今日の運氣をシェア</button>
            ${msg && html`<span style=${{ fontSize: 12, color: C.green }}>${msg}</span>`}
          </div>
        </div>`;
      }

      // ── 初回オンボーディング（価値訴求＋サンプル体験で初回離脱を防ぐ）──
      function Onboarding({ onSample }) {
        const items = [["🗓", "毎日の運氣と占術カレンダーで“今日の動き方”がわかる"], ["🧭", "あなたの性質・才能・人生の流れ（人体星図・大運）"], ["💞", "相性診断と、AI占い師への相談"]];
        return html`<div style=${{ background: `linear-gradient(135deg, ${C.purple}26, ${C.panel})`, border: `1px solid ${C.purple}`, borderRadius: 16, padding: 18, marginBottom: 14 }}>
          <div style=${{ fontSize: 18, fontWeight: 800, marginBottom: 6 }}>🌙 ようこそ、命式ノートへ</div>
          <div style=${{ fontSize: 13, color: C.sub, lineHeight: 1.8, marginBottom: 10 }}>生年月日を入れるだけで、算命学・四柱推命・西洋＆インド占星術をまとめて自前計算します。</div>
          ${items.map(([e, t], i) => html`<div key=${i} style=${{ display: "flex", gap: 8, fontSize: 13, lineHeight: 1.7, marginBottom: 5 }}><span>${e}</span><span style=${{ color: C.text }}>${t}</span></div>`)}
          <button onClick=${onSample} style=${{ marginTop: 10, width: "100%", background: C.purple, color: C.onAccent, border: "none", borderRadius: 10, padding: "11px", fontSize: 15, fontWeight: 700, cursor: "pointer" }}>まずはサンプルで体験する</button>
          <div style=${{ fontSize: 12, color: C.faint, textAlign: "center", marginTop: 6 }}>↓ 下の「生年月日の入力」に自分の情報を入れてもOK</div>
        </div>`;
      }

      // ── ホーム画面に追加の案内（PWAインストール導線・1回閉じたら出さない）──
      const INSTALL_TIP_STORE = "meishiki-note:installtip:v1";
      function InstallTip() {
        const [show, setShow] = useState(() => {
          try { if (isStandalone()) return false; if (localStorage.getItem(INSTALL_TIP_STORE) === "1") return false; } catch {}
          return true;
        });
        if (!show) return null;
        const dismiss = () => { try { localStorage.setItem(INSTALL_TIP_STORE, "1"); } catch {} setShow(false); };
        return html`<div style=${{ ...card, borderStyle: "dashed" }}>
          <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
            <div style=${{ fontSize: 13, color: C.sub, lineHeight: 1.7 }}>
              <b style=${{ color: C.text }}>📲 ホーム画面に追加</b>すると、アプリのように開けて<b>オフラインでも</b>占えます。<br />
              ${isIOS() ? "Safari下部の「共有」ボタン →「ホーム画面に追加」。" : "ブラウザのメニュー →「アプリをインストール」または「ホーム画面に追加」。"}
            </div>
            <button onClick=${dismiss} title="閉じる" style=${{ background: "none", border: "none", color: C.faint, fontSize: 18, cursor: "pointer", lineHeight: 1 }}>×</button>
          </div>
        </div>`;
      }

      // ── 保存できない環境向けの脱出導線（URLコピー）──
      function StorageWarning() {
        const [copied, setCopied] = useState(false);
        return html`<div style=${{ ...card, border: `1px solid ${C.red}`, color: C.red, fontSize: 13, lineHeight: 1.7 }}>
          ⚠️ この端末／ブラウザでは保存ができません（プライベートブラウズ、「サイトデータをブロック」、またはアプリ内の簡易ブラウザの可能性）。<b>通常モードの Safari／Chrome</b> で開き直すと、生年月日も AIキーも記憶されます。
          <div style=${{ marginTop: 8 }}>
            <button onClick=${async () => { if (await copyUrl()) { setCopied(true); setTimeout(() => setCopied(false), 2500); } }} style=${{ background: C.red + "22", border: `1px solid ${C.red}`, color: C.red, borderRadius: 8, padding: "6px 12px", fontSize: 12, cursor: "pointer" }}>🔗 このページのURLをコピー</button>
            ${copied && html`<span style=${{ marginLeft: 8, fontSize: 12 }}>コピー完了。通常ブラウザに貼り付けて開いてください</span>`}
          </div>
        </div>`;
      }

      // サンプル体験用のプロフィール（保存はしない）
      const SAMPLE_FORM = { name: "サンプル", date: "1990-05-15", time: "12:00", gender: "male", place: "東京", memo: "" };

      function App() {
        // 複数プロフィールを保持。選択中があれば初期値として復元（自動入力＆自動鑑定）。
        const [store, setStore] = useState(loadStore);
        const initial = store.profiles.find((p) => p.id === store.currentId) || null;
        const [form, setForm] = useState(() => ({ ...DEFAULT_FORM, ...(initial || {}) }));
        const [birth, setBirth] = useState(() => buildBirth(initial));
        const [editingId, setEditingId] = useState(() => (initial ? initial.id : null));
        const [err, setErr] = useState("");
        const [apiKey, setApiKey] = useState(loadKey);
        const [collapsed, setCollapsed] = useState(() => !!initial); // 保存復元時は入力を畳んで結果を見せる
        const [settings, setSettings] = useState(loadSettings);
        const [theme, setTheme] = useState(loadTheme);
        const [visit] = useState(touchVisit); // 来訪を1日1回記録しストリークを得る
        const [celebrate] = useState(() => checkMilestone(visit.streak)); // 今回到達した節目（無ければ0）
        const [jv, setJv] = useState(0); // 記録保存時に再描画させるカウンタ
        const onJournalSave = () => setJv((v) => v + 1);
        const [sampleMode, setSampleMode] = useState(false);

        const persist = (next) => { setStore(next); saveStore(next); };
        const onSaveKey = (k) => { saveKey(k); setApiKey(k); };
        const onClearKey = () => { clearKey(); setApiKey(""); };
        const onChangeSettings = (s) => { setSettings(s); saveSettings(s); };
        const onToggleTheme = (mode) => { applyTheme(mode); setTheme(mode); };
        const sec = settings.sections;

        const submit = () => {
          setErr("");
          if (!form.date) { setErr("生年月日を入れてください"); return; }
          const id = editingId || newId();
          const entry = { id, name: form.name || "", date: form.date, time: form.time || "", gender: form.gender || "", place: form.place || DEFAULT_FORM.place, memo: form.memo || "" };
          const exists = store.profiles.some((p) => p.id === id);
          const profiles = exists ? store.profiles.map((p) => (p.id === id ? entry : p)) : [...store.profiles, entry];
          persist({ profiles, currentId: id });
          setEditingId(id); setSampleMode(false);
          setBirth(buildBirth(form));
          setCollapsed(true); // 鑑定したら入力を畳む
        };
        const selectProfile = (id) => {
          const p = store.profiles.find((x) => x.id === id); if (!p) return;
          setErr(""); setForm({ ...DEFAULT_FORM, ...p }); setEditingId(id); setBirth(buildBirth(p)); setSampleMode(false);
          persist({ ...store, currentId: id });
          setCollapsed(true);
        };
        const startNew = () => {
          setErr(""); setForm({ ...DEFAULT_FORM }); setEditingId(null); setBirth(null); setSampleMode(false);
          persist({ ...store, currentId: null });
          setCollapsed(false); // 新規入力のため開く
        };
        // サンプル体験：保存せずに結果を表示（初回離脱を防ぐ）
        const viewSample = () => {
          setErr(""); setSampleMode(true); setEditingId(null);
          setForm({ ...SAMPLE_FORM }); setBirth(buildBirth(SAMPLE_FORM)); setCollapsed(true);
        };
        const deleteProfile = (id) => {
          const profiles = store.profiles.filter((p) => p.id !== id);
          persist({ profiles, currentId: store.currentId === id ? null : store.currentId });
          if (editingId === id) { setEditingId(null); setForm({ ...DEFAULT_FORM }); setBirth(null); setCollapsed(false); }
        };
        const data = useMemo(() => {
          if (!birth) return null;
          try {
            const today = new Date().toISOString().slice(0, 10);
            return {
              detail: sanmeiDetail(birth),
              un: sanmeiUn(birth, today),
              ten: tenchusatsu(birth),
              dai: daiun(birth),
              chart: computeChart(birth),
              transit: computeChart({ date: today, time: "12:00", lat: birth.lat, lon: birth.lon, utcOffset: birth.utcOffset }),
              advisor: advisor(birth, today),
            };
          } catch (e) { return { error: String(e.message || e) }; }
        }, [birth && birth.date, birth && birth.time, birth && birth.gender, birth && birth.place]);

        return html`<div style=${{ maxWidth: 600, margin: "0 auto", padding: "20px 16px 60px" }}>
          <div style=${{ textAlign: "center", marginBottom: 4 }}>
            <div style=${{ fontSize: 22, fontWeight: 800, letterSpacing: 1 }}>命式ノート</div>
            <div style=${{ fontSize: 12, color: C.faint }}>算命学・四柱推命・西洋＆インド占星術 — 生年月日からの自前計算</div>
          </div>

          ${!STORAGE_OK && html`<${StorageWarning} />`}
          ${STORAGE_OK && html`<${InstallTip} />`}
          ${!birth && store.profiles.length === 0 && html`<${Onboarding} onSample=${viewSample} />`}

          <div style=${card}>
            <div onClick=${() => setCollapsed(!collapsed)} style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", marginBottom: collapsed ? 0 : 12 }}>
              <span style=${{ fontSize: 14, fontWeight: 700, color: C.text }}>
                ${collapsed ? "🗓 " + (birth ? `${birth.name || birth.date}${birth.name ? "（" + birth.date + "）" : ""}` : "生年月日の入力") : "生年月日の入力"}
              </span>
              <span style=${{ fontSize: 12, color: C.sub }}>${collapsed ? "開く ▼" : "折りたたむ ▲"}</span>
            </div>
            ${!collapsed && html`<div>
            ${store.profiles.length > 0 && html`<div style=${{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
              ${store.profiles.map((p) => {
                const on = p.id === editingId;
                return html`<span key=${p.id} style=${{ display: "inline-flex", alignItems: "center", background: on ? C.purple + "22" : C.panel2, border: `1px solid ${on ? C.purple : C.line}`, borderRadius: 999, padding: "3px 4px 3px 11px" }}>
                  <button onClick=${() => selectProfile(p.id)} style=${{ background: "none", border: "none", color: on ? C.purple : C.text, cursor: "pointer", fontSize: 13, padding: 0, fontWeight: on ? 700 : 400 }}>${labelOf(p)}</button>
                  <button onClick=${() => deleteProfile(p.id)} title="削除" style=${{ background: "none", border: "none", color: C.faint, cursor: "pointer", fontSize: 15, lineHeight: 1, padding: "0 4px" }}>×</button>
                </span>`;
              })}
              <button onClick=${startNew} style=${{ background: "none", border: `1px dashed ${C.line}`, color: C.sub, borderRadius: 999, padding: "4px 12px", fontSize: 13, cursor: "pointer" }}>＋ 新規</button>
            </div>`}
            <input placeholder="名前（任意）" value=${form.name} onInput=${(e) => setForm({ ...form, name: e.target.value })} style=${inp} />
            <label style=${{ fontSize: 12, color: C.sub, display: "block", marginBottom: 2 }}>生年月日</label>
            <input type="date" value=${form.date} onInput=${(e) => setForm({ ...form, date: e.target.value })} style=${inp} />
            <label style=${{ fontSize: 12, color: C.sub, display: "block", marginBottom: 2 }}>出生時刻（不明なら空でOK＝12:00扱い）</label>
            <input type="time" value=${form.time} onInput=${(e) => setForm({ ...form, time: e.target.value })} style=${inp} />
            <div style=${{ display: "flex", gap: 8 }}>
              <div style=${{ flex: 1 }}>
                <label style=${{ fontSize: 12, color: C.sub, display: "block", marginBottom: 2 }}>性別（大運の算出に使用）</label>
                <select value=${form.gender} onChange=${(e) => setForm({ ...form, gender: e.target.value })} style=${inp}>
                  <option value="">未設定</option><option value="male">男性</option><option value="female">女性</option>
                </select>
              </div>
              <div style=${{ flex: 1 }}>
                <label style=${{ fontSize: 12, color: C.sub, display: "block", marginBottom: 2 }}>出生地（近い都市）</label>
                <select value=${form.place} onChange=${(e) => setForm({ ...form, place: e.target.value })} style=${inp}>
                  ${PLACES.map((p) => html`<option key=${p[0]}>${p[0]}</option>`)}
                </select>
              </div>
            </div>
            <label style=${{ fontSize: 12, color: C.sub, display: "block", marginBottom: 2 }}>私について（AIに伝える追加メモ・任意）</label>
            <textarea value=${form.memo} onInput=${(e) => setForm({ ...form, memo: e.target.value })} placeholder="例：30代・経営者。最近の悩みは事業の方向性と健康。慎重な性格。" rows=${2} style=${{ ...inp, resize: "vertical", lineHeight: 1.5 }}></textarea>
            <button onClick=${submit} style=${{ ...inp, marginBottom: 0, width: "100%", background: C.accent, color: C.onAccent, fontWeight: 700, border: "none", cursor: "pointer", fontSize: 16 }}>${editingId ? "更新して鑑定" : "鑑定して保存"}</button>
            <div style=${{ fontSize: 11, color: C.faint, marginTop: 6 }}>
              ${store.profiles.length > 0
                ? "上のタブで保存した人を切り替え・削除できます。「＋新規」で別の人を登録。保存は端末内のみ（外部送信なし）。"
                : "「鑑定して保存」でこの端末に保存します。家族・友人など複数人ぶん登録できます（外部送信なし）。"}
            </div>
            ${err && html`<div style=${{ fontSize: 13, color: C.red, marginTop: 8 }}>${err}</div>`}
            </div>`}
          </div>

          <${Settings} settings=${settings} onChange=${onChangeSettings} theme=${theme} onToggleTheme=${onToggleTheme} />

          ${data && data.error && html`<div style=${{ ...card, color: C.red }}>計算エラー：${data.error}</div>`}
          ${data && !data.error && html`<div>
            ${sampleMode && html`<div style=${{ background: C.purple + "1A", border: `1px solid ${C.purple}`, borderRadius: 12, padding: "10px 12px", marginBottom: 12, fontSize: 13, color: C.text, lineHeight: 1.6 }}>
              👀 これは<b>サンプル表示</b>です。<button onClick=${startNew} style=${{ background: C.purple, color: C.onAccent, border: "none", borderRadius: 8, padding: "5px 12px", fontSize: 13, fontWeight: 700, cursor: "pointer", marginLeft: 4 }}>自分の生年月日で見る</button>
            </div>`}
            ${data.un && html`<${TodayHero} key=${`${birth.date}|${birth.time}|${birth.place}|${sampleMode ? "s" : ""}`} un=${data.un} visit=${visit} celebrate=${celebrate} name=${sampleMode ? "" : birth.name} apiKey=${sampleMode ? "" : apiKey} context=${buildOracleContext(data, birth)} birth=${birth} dailyOracle=${settings.dailyOracle} />`}
            ${!sampleMode && html`<div style=${{ ...card }}>
              <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
                <span style=${{ fontSize: 15, fontWeight: 700, color: C.green }}>📔 今日の記録</span>
                <span style=${{ fontSize: 12, color: C.faint }}>${jv >= 0 ? `これまで ${journalCount()}日ぶん` : ""}</span>
              </div>
              <div style=${{ fontSize: 12, color: C.faint, marginBottom: 8 }}>今日の気分とひとことを残すと、カレンダーに記録が貯まります。</div>
              <${MoodPicker} key=${`today|${jv}`} dateISO=${new Date().toISOString().slice(0, 10)} onSaved=${onJournalSave} />
            </div>`}
            ${birth.name && !sampleMode && html`<div style=${{ fontSize: 13, color: C.sub, marginBottom: 10 }}>${birth.name} さんの命式</div>`}
            ${!birth.timeKnown && html`<div style=${{ fontSize: 12, color: C.accent, background: C.accent + "14", border: `1px solid ${C.accent}55`, borderRadius: 8, padding: "7px 10px", marginBottom: 10, lineHeight: 1.6 }}>
              出生時刻が未入力のため <b>12:00</b> として計算しています。時柱・ASC（上昇宮）は概算です。
            </div>`}
            ${sec.natal !== false && data.chart && html`<${Section} title="ネイタルチャート（出生図）" color=${C.purple} sub="西洋占星術の主役。生まれた瞬間の天体配置・サイン・ハウス・アスペクトを読み解きます。">
              <${Horoscope} chart=${data.chart} />
            <//>`}
            ${sec.wforecast !== false && data.chart && data.transit && html`<${Section} title="西洋占星術の運勢（今日・今月・今年・運命）" color=${C.green} sub="運行中の天体をあなたの出生図に重ねた、日・月・年・運命の流れ。">
              <${AstroForecast} natal=${data.chart} transit=${data.transit} birth=${birth} />
            <//>`}
            ${sec.love !== false && data.chart && html`<${Section} title="恋愛・異性への関心（西洋占星術）" color=${C.red} sub="金星・火星・月・DSCから恋愛傾向、金星のハウスで恋の舞台、運行中の金星で今の恋の運勢まで。">
              <${Love} chart=${data.chart} transit=${data.transit} />
            <//>`}
            ${sec.life !== false && data.chart && html`<${Section} title="分野別の動き方・課題（西洋占星術）" color=${C.accent} sub="各分野の活かし方と課題に、今の幸運期(木星♃)・正念場(土星♄)を重ねて表示。">
              <${LifeAreas} chart=${data.chart} transit=${data.transit} />
            <//>`}
            ${sec.advisor && data.advisor && html`<${Section} title="専属占術師アドバイス" color=${C.accent} sub="あなたの命式から、ビジネス・人間関係・健康・今日の指針を読み解きます。">
              <${Advisor} adv=${data.advisor} />
            <//>`}
            ${sec.chat && html`<${Section} title="AIに相談する（占い師チャット）" color=${C.green} sub="あなたの命式を踏まえて、占い師に直接相談できます。※相談時は命式と相談内容を Gemini に送信します。">
              <${Chat} key=${`${birth.date}|${birth.time}|${birth.place}|${editingId || ""}`} apiKey=${apiKey} onSaveKey=${onSaveKey} onClearKey=${onClearKey} context=${buildOracleContext(data, birth)} name=${birth.name} tone=${settings.tone} replyLength=${settings.replyLength} oracleName=${settings.oracleName} />
            <//>`}
            ${sec.calendar && data.ten !== undefined && html`<${Section} title="占術カレンダー" color=${C.blue} sub="日ごとの「気」の流れ（攻め／労い／整える／守り）と天中殺日。日付をタップで詳しく。">
              <${Calendar} birth=${birth} ten=${data.ten} onJournalSave=${onJournalSave} />
            <//>`}
            ${sec.jintai && data.detail && html`<${Section} title="算命学・人体星図" color=${C.purple} sub="生年月日から出す“心の設計図”。各星をタップで意味が出ます。">
              <${Jintai} detail=${data.detail} />
            <//>`}
            ${sec.un && data.un && html`<${Section} title="今日・今月・今年の運氣" color=${C.purple} sub="あなたの日干に、今動いている星（十大主星）を重ねた流れ・動き方。">
              <${Flow} un=${data.un} />
            <//>`}
            ${sec.unsei && (data.ten || data.dai) && html`<${Section} title="天中殺・大運（人生の流れ）" color=${C.blue}>
              <${Unsei} ten=${data.ten} dai=${data.dai} />
            <//>`}
            ${sec.aishou && html`<${Section} title="相性を見る（2人）" color=${C.green}>
              <${Aishou} birth=${birth} />
            <//>`}
            ${sec.astro && data.chart && html`<${Section} title="インド占星術・サイデリアル（補助）" color=${C.accent} sub="ナクシャトラやダシャー（インド式の運勢周期）。西洋のネイタルは上のチャートを参照。">
              <${AstroSummary} chart=${data.chart} />
            <//>`}
            <div style=${{ fontSize: 11, color: C.faint, textAlign: "center", marginTop: 10, lineHeight: 1.6 }}>占いとして参考程度に。占いの計算・保存はすべて端末内で完結します。AI相談を使う場合のみ、命式と相談内容を Gemini（Google）に送信します。</div>
          </div>`}
        </div>`;
      }

      createRoot(document.getElementById("root")).render(html`<${App} />`);
    </script>
  </body>
</html>
