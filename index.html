        return html`<div style=${{ ...card, border: `1px solid ${C.red}`, color: C.red, fontSize: 13, lineHeight: 1.7 }}>
          ⚠️ この端末／ブラウザでは保存ができません（プライベートブラウズ、「サイトデータをブロック」、またはアプリ内の簡易ブラウザの可能性）。<b>通常モードの Safari／Chrome</b> で開き直すと、生年月日も AIキーも記憶されます。
          <div style=${{ marginTop: 8 }}>

      // サンプル体験用のプロフィール（保存はしない）
      const SAMPLE_FORM = { name: "サンプル", date: "1990-05-15", time: "12:00", gender: "male", place: "東京", memo: "" };

      // ── あなたの鑑定書（プロの鑑定文風・読み物）──
      // 携帯公式占い等で定番の「章立て・二人称・です/ます長文」様式を、端末内の計算結果から生成。
      // 文章はすべて本アプリのオリジナル。断定的な的中表現は使わない（景表法配慮）。
      function Kanteisho({ detail, ten, dai, birth }) {
        if (!detail || !detail.dayType) return null;
        const honor = birth.name ? `${birth.name}さん` : "あなた";
        const dt = detail.dayType;
        const center = detail.stars.find((s) => s.pos === "center") || detail.stars[0];
        const others = detail.stars.filter((s) => s !== center);
        const en = detail.energies || [];
        const d = new Date(birth.date + "T00:00:00");
        const dLabel = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
        const serif = { fontFamily: '"Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif', lineHeight: 2.05, fontSize: 14.5, color: C.text };

        return html`<div style=${{ background: C.panel, border: `1px solid ${C.accent}66`, borderRadius: 16, padding: "24px 20px", marginBottom: 16, boxShadow: `inset 0 0 0 4px ${C.bg}, inset 0 0 0 5px ${C.accent}44` }}>

            <div style=${{ fontSize: 11, color: C.accent, letterSpacing: 6 }}>命式鑑定書</div>
            <div style=${{ ...serif, fontSize: 19, fontWeight: 700, marginTop: 4 }}>${honor}の星の設計図</div>
            <div style=${{ fontSize: 11.5, color: C.faint, marginTop: 6 }}>${dLabel} 生まれ ／ 命式：${detail.pillars.year}年 ${detail.pillars.month}月 ${detail.pillars.day}日</div>
          </div>
          ${p(`${honor}。ようこそ、あなたの鑑定書へ。ここに記すのは、${dLabel}にこの世に生を受けた、あなたという人の“設計図”です。星は未来を縛るものではありません。自分の質を知り、流れに沿って生きるための、静かな道しるべです。どうぞご自身と対話するつもりで、ゆっくり読み進めてください。`)}
          ${chap("一", "あなたという人——生まれ持った質")}
          ${p(`あなたの日干（生まれた日の天干）は「${dt.stem}」。陰陽五行でいえば${dt.yinYang}の${dt.element}、${dt.label}にたとえられる質です。${dt.desc}`)}
          ${p(`そして、あなたの胸の中心には「${center.star}」が据えられています。${center.desc}この星と${dt.label}の質が重なり合うところに、${honor}の生き方の芯——迷ったとき立ち返る場所があります。`)}
          ${chap("二", "五つの星が語るあなた")}
          ${p(`算命学では、人の性を五つの方位に宿る星で読み解きます。${honor}の星々は、次のように並んでいます。`)}
          ${others.map((s, i) => p(html`<b style=${{ color: C.purple }}>${s.emoji} ${s.posLabel}に「${s.star}」</b>——${s.posMeaning}。${s.desc}`))}
          ${chap("三", "人生という三つの季節")}
          ${p("人生を、初年・中年・晩年という三つの季節にたとえるなら——")}
          ${en.map((e) => p(html`<b style=${{ color: C.blue }}>${e.phase}期は「${e.name}」</b>（気の強さ ${e.energy}）。${(e.meaning && (e.meaning.desc || e.meaning)) || ""}`))}
          ${ten && chap("四", "運気の休息期——天中殺")}
          ${ten && p(`あなたの天中殺は「${ten.group}」。${ten.desc}直近では${(ten.years || []).map((y) => `${y}年`).join("と")}がその時期にあたります。この二年間は、無理に新しい扉を開くより、積み上げてきたものを整え、学びを深めることが、次の飛躍のいちばんの土台になります。`)}
          ${cur && !cur.preStart && chap("五", "いま歩いている十年")}
          ${cur && !cur.preStart && p(`大運で見ると、いまのあなたは「${cur.star}」の十年（${cur.ageFrom}歳〜${cur.ageTo}歳）を歩いています。この期のテーマは「${cur.theme || ""}」。${next ? `続く${next.ageFrom}歳からは「${next.star}」の十年へと移ろい、テーマは「${next.theme}」に変わります。いまの季節を味わい尽くすことが、次の季節への何よりの準備です。` : ""}`)}
          ${cur && cur.preStart && chap("五", "これから始まる十年")}
          ${cur && cur.preStart && p(`あなたの大運（十年ごとの大きな流れ）は${cur.startAge}歳から始まります。いまは、その最初の季節に向けて土を耕している時期。焦らず、好奇心のままに種を集めてください。`)}
          ${chap("結", "むすびに")}
          ${p(`ここまで読んでくださって、ありがとうございます。星の示す質は、良し悪しではなく「持ち味」です。${honor}が${honor}のままで進むとき、流れはいちばん滑らかになります。この鑑定書は、いつでも開ける“自分の取扱説明書”として、お手元に。今日という一日を、あなたらしく。`)}
          <div style=${{ textAlign: "right", marginTop: 14, fontSize: 11.5, color: C.faint }}>鑑定日 ${ymd(new Date()).replace(/-/g, "/")} ・ 命式ノート</div>
        </div>`;
      }

      // ── 課金UI（BILLING未設定なら何も出ない＝現状維持）──
      const subLabel = () => BILLING.ctaLabel || (BILLING.trialDays > 0 ? `✨ ${BILLING.trialDays}日間 無料ではじめる` : (BILLING.mode === "mosh" ? "✨ MOSHで購読する" : "✨ 購読する"));
      function SubscribeButton({ small }) {
        if (!BILLING.checkoutUrl) return null;
        const go = () => { track("checkout_click"); try { location.href = checkoutHref(); } catch {} };
        return html`<button onClick=${go} style=${{ background: C.accent, color: C.onAccent, border: "none", borderRadius: 999, padding: small ? "8px 16px" : "12px 22px", fontSize: small ? 14 : 16, fontWeight: 700, cursor: "pointer" }}>${subLabel()}</button>`;
      }
      // 会員コード入力（MOSHで購読後に届くコードで解除）
      function UnlockBox({ onActive }) {
        const [code, setCode] = useState("");
        const [busy, setBusy] = useState(false);
        const [err, setErr] = useState("");
        if (!BILLING.api) return null;
        const submit = async () => { setBusy(true); setErr(""); const r = await redeemCode(code); setBusy(false); if (r && r.active) { onActive && onActive(r); } else { setErr("コードを確認できませんでした。購読後に届くコードをご確認ください。"); } };
        return html`<div style=${{ marginTop: 12, textAlign: "left" }}>
          <div style=${{ fontSize: 12, color: C.sub, marginBottom: 4 }}>購読済みの方：会員コードを入力</div>
          <div style=${{ display: "flex", gap: 6 }}>
            <input value=${code} onInput=${(e) => setCode(e.target.value)} placeholder="会員コード" style=${{ ...inp, marginBottom: 0, flex: 1 }} />
            <button onClick=${submit} disabled=${busy} style=${{ background: C.purple, color: C.onAccent, border: "none", borderRadius: 11, padding: "0 16px", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>${busy ? "確認中" : "解除"}</button>
          </div>
          ${err && html`<div style=${{ fontSize: 12, color: C.red, marginTop: 6 }}>${err}</div>`}
        </div>`;
      }
      function PremiumCTA({ onActive }) {
        if (!BILLING.checkoutUrl && !BILLING.api) return null;
        const trialLine = BILLING.trialDays > 0 ? `${BILLING.trialDays}日間無料、その後 ` : "";
        return html`<div style=${{ ...card, background: `linear-gradient(135deg, ${C.accent}22, ${C.panel})`, border: `1px solid ${C.accent}`, textAlign: "center" }}>
          <div style=${{ fontSize: 16, fontWeight: 800, color: C.text, marginBottom: 4 }}>✨ プレミアムで“毎日の指針”をフル解放</div>
          <div style=${{ fontSize: 13, color: C.sub, lineHeight: 1.7, marginBottom: 12 }}>運勢（今日・今月・今年・運命）／占術カレンダー／AI相談・チャット／ネイタル詳細・分野別ガイド。${trialLine}年¥10,000。いつでも解約できます。</div>
          <${SubscribeButton} />
          ${BILLING.mode === "mosh" && BILLING.checkoutUrl && html`<div style=${{ fontSize: 12, color: C.faint, marginTop: 8, lineHeight: 1.6 }}>MOSHで購読 → 届いた<b>会員コード</b>を下に入力すると解除されます。</div>`}
          <${UnlockBox} onActive=${onActive} />
          ${BILLING.portalUrl && html`<div style=${{ marginTop: 10 }}><a href=${BILLING.portalUrl} style=${{ fontSize: 12, color: C.faint }}>解約・購読の管理はこちら</a></div>`}
        </div>`;
      }
      function Locked({ label }) {
        useEffect(() => { track("paywall_view"); }, []);
        return html`<div style=${{ ...card, borderStyle: "dashed", textAlign: "center" }}>
          <div style=${{ fontSize: 15, fontWeight: 700, color: C.text }}>🔒 ${label}</div>
          <div style=${{ fontSize: 13, color: C.sub, margin: "6px 0 12px" }}>プレミアム会員で解放されます</div>
          <${SubscribeButton} small=${true} />
        </div>`;
      }

      function App() {
        // 複数プロフィールを保持。選択中があれば初期値として復元（自動入力＆自動鑑定）。
        const [store, setStore] = useState(loadStore);
        const initial = store.profiles.find((p) => p.id === store.currentId) || null;
        const [form, setForm] = useState(() => ({ ...DEFAULT_FORM, ...(initial || {}) }));
        const [birth, setBirth] = useState(() => buildBirth(initial));
        const [editingId, setEditingId] = useState(() => (initial ? initial.id : null));
        const [err, setErr] = useState("");
        const [apiKey, setApiKey] = useState(loadKey);
        const [collapsed, setCollapsed] = useState(() => !!initial); // 保存復元時は入力を畳んで結果を見せる
        const [settings, setSettings] = useState(loadSettings);
        const [theme, setTheme] = useState(loadTheme);
        const [visit] = useState(touchVisit); // 来訪を1日1回記録しストリークを得る
        const [celebrate] = useState(() => checkMilestone(visit.streak)); // 今回到達した節目（無ければ0）
        const [jv, setJv] = useState(0); // 記録保存時に再描画させるカウンタ
        const onJournalSave = () => setJv((v) => v + 1);
        const [sampleMode, setSampleMode] = useState(false);
        const [view, setView] = useState("today"); // 画面タブ：今日/わたし/運勢/恋愛/相談
        const [ent, setEnt] = useState(loadEnt); // 購読権利（OFF時は常にactive扱い）
        useEffect(() => { track("app_open"); verifyEntitlement().then(setEnt); }, []);
        // 「今日」はローカル日付で管理し、日付が変わったら（開きっぱなし・翌朝再表示でも）自動で今日の運勢に切り替える
        const [todayKey, setTodayKey] = useState(() => ymd(new Date()));
        useEffect(() => {
          const check = () => { const t = ymd(new Date()); setTodayKey((prev) => (prev === t ? prev : t)); };
          document.addEventListener("visibilitychange", check);
          window.addEventListener("focus", check);
          const iv = setInterval(check, 60000);
          return () => { document.removeEventListener("visibilitychange", check); window.removeEventListener("focus", check); clearInterval(iv); };
        }, []);
        const entitled = !BILLING.api || !!(ent && ent.active); // BILLING未設定なら全機能開放（現状維持）
        const gateP = (node, label) => (entitled ? node : html`<${Locked} label=${label} />`); // 有料機能のゲート

        const persist = (next) => { setStore(next); saveStore(next); };
        const onSaveKey = (k) => { saveKey(k); setApiKey(k); };
        const onClearKey = () => { clearKey(); setApiKey(""); };
        const onChangeSettings = (s) => { setSettings(s); saveSettings(s); };
        const onToggleTheme = (mode) => { applyTheme(mode); setTheme(mode); };
        const sec = settings.sections;

        const submit = () => {
          setErr("");
          if (!form.date) { setErr("生年月日を入れてください"); return; }
          const id = editingId || newId();
          const entry = { id, name: form.name || "", date: form.date, time: form.time || "", gender: form.gender || "", place: form.place || DEFAULT_FORM.place, memo: form.memo || "" };
          const exists = store.profiles.some((p) => p.id === id);
          const profiles = exists ? store.profiles.map((p) => (p.id === id ? entry : p)) : [...store.profiles, entry];
          persist({ profiles, currentId: id });
          setEditingId(id); setSampleMode(false);
          setBirth(buildBirth(form));
          setCollapsed(true); // 鑑定したら入力を畳む
        };
        const selectProfile = (id) => {
          const p = store.profiles.find((x) => x.id === id); if (!p) return;
          setErr(""); setForm({ ...DEFAULT_FORM, ...p }); setEditingId(id); setBirth(buildBirth(p)); setSampleMode(false);
          persist({ ...store, currentId: id });
          setCollapsed(true);
        };
        const startNew = () => {
          setErr(""); setForm({ ...DEFAULT_FORM }); setEditingId(null); setBirth(null); setSampleMode(false);
          persist({ ...store, currentId: null });
          setCollapsed(false); // 新規入力のため開く
        };
        // サンプル体験：保存せずに結果を表示（初回離脱を防ぐ）
        const viewSample = () => {
          setErr(""); setSampleMode(true); setEditingId(null);
          setForm({ ...SAMPLE_FORM }); setBirth(buildBirth(SAMPLE_FORM)); setCollapsed(true);
        };
        const deleteProfile = (id) => {
          const profiles = store.profiles.filter((p) => p.id !== id);
          persist({ profiles, currentId: store.currentId === id ? null : store.currentId });
          if (editingId === id) { setEditingId(null); setForm({ ...DEFAULT_FORM }); setBirth(null); setCollapsed(false); }
        };
        const data = useMemo(() => {
          if (!birth) return null;
          try {
            const today = todayKey; // ローカル日付（UTCずれ・日付またぎ対策済み）
            const transit = computeChart({ date: today, time: "12:00", lat: birth.lat, lon: birth.lon, utcOffset: birth.utcOffset });
            let exits = null;
            try {
              const tl = transit.lons || {};
              exits = {
                木星: tl.木星 != null ? accurateExit("木星", Math.floor((((tl.木星 % 360) + 360) % 360) / 30)) : null,
                土星: tl.土星 != null ? accurateExit("土星", Math.floor((((tl.土星 % 360) + 360) % 360) / 30)) : null,
              };
            } catch { exits = null; }
            return {
              detail: sanmeiDetail(birth),
              un: sanmeiUn(birth, today),
              ten: tenchusatsu(birth),
              dai: daiun(birth),
              chart: computeChart(birth),
              transit,
              exits,
              advisor: advisor(birth, today),
            };
          } catch (e) { return { error: String(e.message || e) }; }
        }, [birth && birth.date, birth && birth.time, birth && birth.gender, birth && birth.place, todayKey]);

        return html`<div style=${{ maxWidth: 600, margin: "0 auto", padding: "20px 16px 60px" }}>
          <div style=${{ textAlign: "center", marginBottom: 4 }}>
            <div style=${{ fontSize: 23, fontWeight: 800, letterSpacing: 1 }}>命式ノート</div>
            <div style=${{ fontSize: 12.5, color: C.faint }}>生年月日から、毎日の指針と“自分の取扱説明書”を。</div>
          </div>

          ${!STORAGE_OK && html`<${StorageWarning} />`}
          ${STORAGE_OK && html`<${InstallTip} />`}
          ${!birth && store.profiles.length === 0 && html`<${Onboarding} onSample=${viewSample} />`}

          <div style=${card}>
            <div onClick=${() => setCollapsed(!collapsed)} style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", marginBottom: collapsed ? 0 : 12 }}>
              <span style=${{ fontSize: 14, fontWeight: 700, color: C.text }}>
                ${collapsed ? "🗓 " + (birth ? `${birth.name || birth.date}${birth.name ? "（" + birth.date + "）" : ""}` : "生年月日の入力") : "生年月日の入力"}
              </span>
              <span style=${{ fontSize: 12, color: C.sub }}>${collapsed ? "開く ▼" : "折りたたむ ▲"}</span>
            </div>
            ${!collapsed && html`<div>
            ${store.profiles.length > 0 && html`<div style=${{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
              ${store.profiles.map((p) => {
                const on = p.id === editingId;
                return html`<span key=${p.id} style=${{ display: "inline-flex", alignItems: "center", background: on ? C.purple + "22" : C.panel2, border: `1px solid ${on ? C.purple : C.line}`, borderRadius: 999, padding: "3px 4px 3px 11px" }}>
                  <button onClick=${() => selectProfile(p.id)} style=${{ background: "none", border: "none", color: on ? C.purple : C.text, cursor: "pointer", fontSize: 13, padding: 0, fontWeight: on ? 700 : 400 }}>${labelOf(p)}</button>
                  <button onClick=${() => deleteProfile(p.id)} title="削除" style=${{ background: "none", border: "none", color: C.faint, cursor: "pointer", fontSize: 15, lineHeight: 1, padding: "0 4px" }}>×</button>
                </span>`;
              })}
              <button onClick=${startNew} style=${{ background: "none", border: `1px dashed ${C.line}`, color: C.sub, borderRadius: 999, padding: "4px 12px", fontSize: 13, cursor: "pointer" }}>＋ 新規</button>
            </div>`}
            <input placeholder="名前（任意）" value=${form.name} onInput=${(e) => setForm({ ...form, name: e.target.value })} style=${inp} />
            <label style=${{ fontSize: 12, color: C.sub, display: "block", marginBottom: 2 }}>生年月日</label>
            <input type="date" value=${form.date} onInput=${(e) => setForm({ ...form, date: e.target.value })} style=${inp} />
            <label style=${{ fontSize: 12, color: C.sub, display: "block", marginBottom: 2 }}>出生時刻（不明なら空でOK＝12:00扱い）</label>
            <input type="time" value=${form.time} onInput=${(e) => setForm({ ...form, time: e.target.value })} style=${inp} />
            <div style=${{ display: "flex", gap: 8 }}>
              <div style=${{ flex: 1 }}>
                <label style=${{ fontSize: 12, color: C.sub, display: "block", marginBottom: 2 }}>性別（大運の算出に使用）</label>
                <select value=${form.gender} onChange=${(e) => setForm({ ...form, gender: e.target.value })} style=${inp}>
                  <option value="">未設定</option><option value="male">男性</option><option value="female">女性</option>
                </select>
              </div>
              <div style=${{ flex: 1 }}>
                <label style=${{ fontSize: 12, color: C.sub, display: "block", marginBottom: 2 }}>出生地（近い都市）</label>
                <select value=${form.place} onChange=${(e) => setForm({ ...form, place: e.target.value })} style=${inp}>
                  ${PLACES.map((p) => html`<option key=${p[0]}>${p[0]}</option>`)}
                </select>
              </div>
            </div>
            <label style=${{ fontSize: 12, color: C.sub, display: "block", marginBottom: 2 }}>私について（AIに伝える追加メモ・任意）</label>
            <textarea value=${form.memo} onInput=${(e) => setForm({ ...form, memo: e.target.value })} placeholder="例：30代・経営者。最近の悩みは事業の方向性と健康。慎重な性格。" rows=${2} style=${{ ...inp, resize: "vertical", lineHeight: 1.5 }}></textarea>
            <button onClick=${submit} style=${{ ...inp, marginBottom: 0, width: "100%", background: C.accent, color: C.onAccent, fontWeight: 700, border: "none", cursor: "pointer", fontSize: 16 }}>${editingId ? "更新して鑑定" : "鑑定して保存"}</button>
            <div style=${{ fontSize: 11, color: C.faint, marginTop: 6 }}>
              ${store.profiles.length > 0
                ? "上のタブで保存した人を切り替え・削除できます。「＋新規」で別の人を登録。保存は端末内のみ（外部送信なし）。"
                : "「鑑定して保存」でこの端末に保存します。家族・友人など複数人ぶん登録できます（外部送信なし）。"}
            </div>
            ${err && html`<div style=${{ fontSize: 13, color: C.red, marginTop: 8 }}>${err}</div>`}
            </div>`}
          </div>

          <${Settings} settings=${settings} onChange=${onChangeSettings} theme=${theme} onToggleTheme=${onToggleTheme} />

          ${data && data.error && html`<div style=${{ ...card, color: C.red }}>計算エラー：${data.error}</div>`}
          ${data && !data.error && html`<div>
            ${sampleMode && html`<div style=${{ background: C.purple + "1A", border: `1px solid ${C.purple}`, borderRadius: 12, padding: "10px 12px", marginBottom: 12, fontSize: 13, color: C.text, lineHeight: 1.6 }}>
              👀 これは<b>サンプル表示</b>です。<button onClick=${startNew} style=${{ background: C.purple, color: C.onAccent, border: "none", borderRadius: 8, padding: "5px 12px", fontSize: 13, fontWeight: 700, cursor: "pointer", marginLeft: 4 }}>自分の生年月日で見る</button>
            </div>`}
            <div style=${{ position: "sticky", top: 0, zIndex: 5, background: C.bg, display: "flex", gap: 3, padding: "8px 0 9px", marginBottom: 10, borderBottom: `1px solid ${C.line}`, overflowX: "auto" }}>
              ${[["today", "🌙 今日"], ["me", "✦ わたし"], ["fortune", "🔮 運勢"], ["love", "💞 恋愛"], ["talk", "🧭 相談"]].map(([k, label]) => { const on = view === k; return html`<button key=${k} className="tap" onClick=${() => { haptic(); setView(k); }} style=${{ flex: "1 0 auto", whiteSpace: "nowrap", border: "none", background: on ? C.purple + "1F" : "none", color: on ? C.purple : C.sub, fontSize: 15, fontWeight: on ? 800 : 600, padding: "10px 13px", borderBottom: `2.5px solid ${on ? C.purple : "transparent"}`, borderRadius: "9px 9px 0 0", cursor: "pointer" }}>${label}</button>`; })}
            </div>

            ${!entitled && html`<${PremiumCTA} onActive=${setEnt} />`}
            ${view === "today" && html`<div>
              ${data.un && html`<${TodayHero} key=${`${todayKey}|${birth.date}|${birth.time}|${birth.place}|${sampleMode ? "s" : ""}`} un=${data.un} visit=${visit} celebrate=${celebrate} name=${sampleMode ? "" : birth.name} apiKey=${sampleMode ? "" : apiKey} context=${buildOracleContext(data, birth)} birth=${birth} dailyOracle=${settings.dailyOracle} />`}
              ${!birth.timeKnown && html`<div style=${{ fontSize: 13, color: C.accent, background: C.accent + "14", border: `1px solid ${C.accent}55`, borderRadius: 10, padding: "9px 12px", marginBottom: 12, lineHeight: 1.7 }}>
                出生時刻が未入力のため <b>12:00</b> として計算しています。時刻が分かると、ASC（上昇宮）やハウスがより正確になります。
              </div>`}
              ${sec.week !== false && data.chart && html`<${Section} title="今週のハイライト" color=${C.green} sub="運行中の月があなたの星を巡る7日間。好機の日・要注意の日をひと目で。">
                <${WeekHighlight} natal=${data.chart} birth=${birth} />
              <//>`}
              ${!sampleMode && html`<${TodayThread} birth=${birth} jv=${jv} onSaved=${onJournalSave} />`}
              ${!sampleMode && data.chart && html`<${Coaching} natal=${data.chart} transit=${data.transit} />`}
            </div>`}
            ${view === "me" && html`<div>
              ${birth.name && !sampleMode && html`<div style=${{ fontSize: 14, color: C.sub, marginBottom: 10 }}>${birth.name} さんの星</div>`}
              ${data.chart && html`<${Signature} chart=${data.chart} />`}
              ${data.chart && html`<${Insight} chart=${data.chart} />`}
              ${data.chart && html`<${SoulNode} chart=${data.chart} />`}
              ${data.detail && gateP(html`<${Section} title="📜 あなたの鑑定書（読み物）" color=${C.accent} sub="章立ての鑑定文で、あなたの質・五つの星・人生の季節・天中殺・いまの十年をひとつづきに読み解きます。" collapsible=${true} defaultOpen=${false}>
                <${Kanteisho} detail=${data.detail} ten=${data.ten} dai=${data.dai} birth=${birth} />
              <//>`, "あなたの鑑定書（読み物）")}
              ${sec.natal !== false && data.chart && gateP(html`<${Section} title="ネイタルチャート（出生図）" color=${C.purple} sub="生まれた瞬間の星空。天体をタップすると、あなたの性格や才能が分かります。" collapsible=${true}>
                <${Horoscope} chart=${data.chart} />
              <//>`, "ネイタルチャート（出生図）")}
              ${sec.life !== false && data.chart && gateP(html`<${Section} title="分野別ガイド（仕事・お金・健康ほか）" color=${C.accent} sub="分野ごとの「活かし方・気をつけること・いい時期」をやさしく。" collapsible=${true}>
                <${LifeAreas} chart=${data.chart} transit=${data.transit} exits=${data.exits} />
              <//>`, "分野別ガイド（仕事・お金・健康ほか）")}
              ${sec.jintai && data.detail && html`<${Section} title="算命学・人体星図（東洋の見方）" color=${C.purple} sub="生年月日から出す“心の設計図”。各星をタップで意味が出ます。" collapsible=${true} defaultOpen=${false}>
                <${Jintai} detail=${data.detail} />
              <//>`}
            </div>`}

            ${view === "fortune" && html`<div>
              ${sec.wforecast !== false && data.chart && data.transit && gateP(html`<${Section} title="運勢（今日・今月・今年・運命）" color=${C.green} sub="運行中の星をあなたの出生図に重ねた、日・月・年・運命の流れ。">
                <${AstroForecast} natal=${data.chart} transit=${data.transit} birth=${birth} exits=${data.exits} />
              <//>`, "運勢（今日・今月・今年・運命）")}
              ${sec.calendar && data.ten !== undefined && gateP(html`<${Section} title="占いカレンダー" color=${C.blue} sub="日ごとの流れ（攻め／労い／整える／守り）と気をつけたい日。日付タップで詳しく。" collapsible=${true} defaultOpen=${false}>
                <${Calendar} birth=${birth} ten=${data.ten} onJournalSave=${onJournalSave} />
              <//>`, "占いカレンダー")}
              ${sec.un && data.un && gateP(html`<${Section} title="今日・今月・今年の運氣（東洋の見方）" color=${C.purple} sub="あなたの日干に、今動いている星を重ねた流れ・動き方。" collapsible=${true} defaultOpen=${false}>
                <${Flow} un=${data.un} />
              <//>`, "今日・今月・今年の運氣（東洋の見方）")}
              ${sec.unsei && (data.ten || data.dai) && gateP(html`<${Section} title="天中殺・大運（人生の流れ・東洋）" color=${C.blue} collapsible=${true} defaultOpen=${false}>
                <${Unsei} ten=${data.ten} dai=${data.dai} />
              <//>`, "天中殺・大運（人生の流れ・東洋）")}
            </div>`}

            ${view === "love" && html`<div>
              ${sec.love !== false && data.chart && html`<${Section} title="恋愛・異性への関心" color=${C.red} sub="あなたの恋愛傾向・惹かれるタイプ・恋が動く場面・今の恋の運勢まで。">
                <${Love} chart=${data.chart} transit=${data.transit} />
              <//>`}
              ${sec.aishou && html`<${Section} title="相性を見る（2人・東洋）" color=${C.green} collapsible=${true} defaultOpen=${false}>
                <${Aishou} birth=${birth} />
              <//>`}
            </div>`}

            ${view === "talk" && html`<div>
              ${data.chart && gateP(html`<${Section} title="🧭 迷ったときの相談" color=${C.purple} sub="人生の岐路で「動くべきか・いつか」を、あなたの星と今の時期から。">
                <${Consult} birth=${birth} chart=${data.chart} transit=${data.transit} exits=${data.exits} apiKey=${apiKey} context=${buildOracleContext(data, birth)} tone=${settings.tone} />
              <//>`, "迷ったときの相談")}
              ${sec.advisor && data.advisor && html`<${Section} title="専属占術師アドバイス" color=${C.accent} sub="あなたの星から、仕事・人間関係・健康・今日の指針を読み解きます。">
                <${Advisor} adv=${data.advisor} />
              <//>`}
              ${sec.chat && gateP(html`<${Section} title="AIに相談する（占い師チャット）" color=${C.green} sub="あなたの星を踏まえて、占い師に直接相談できます。※相談時のみ内容を Gemini に送信します。">
                <${Chat} key=${`${birth.date}|${birth.time}|${birth.place}|${editingId || ""}`} apiKey=${apiKey} onSaveKey=${onSaveKey} onClearKey=${onClearKey} context=${buildOracleContext(data, birth)} name=${birth.name} tone=${settings.tone} replyLength=${settings.replyLength} oracleName=${settings.oracleName} />
              <//>`, "AIに相談する（占い師チャット）")}
              ${sec.astro && data.chart && html`<${Section} title="インド占星術・サイデリアル（補助）" color=${C.accent} sub="ナクシャトラやダシャー（インド式の運勢周期）。" collapsible=${true} defaultOpen=${false}>
                <${AstroSummary} chart=${data.chart} />
              <//>`}
              <${Section} title="この占いの根拠・精度について" color=${C.blue} sub="人の監修に頼らず、計算方法と根拠の開示で信頼を担保しています。" collapsible=${true} defaultOpen=${false}>
                <${MethodNote} />
              <//>
            </div>`}

            <div style=${{ fontSize: 11, color: C.faint, textAlign: "center", marginTop: 16, lineHeight: 1.6 }}>占いとして参考程度に。計算・保存はすべて端末内で完結します。AI相談を使う場合のみ、内容を Gemini（Google）に送信します。</div>
          </div>`}
        </div>`;
      }

      createRoot(document.getElementById("root")).render(html`<${App} />`);
    </script>
  </body>
</html>
