name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/divination-app-qo0dg4", "main"]
  workflow_dispatch:

# GITHUB_TOKEN に Pages 公開の権限を付与
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は1つに（古いデプロイはキャンセル）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pages を（未有効なら）API 経由で有効化し、ビルド種別を「GitHub Actions」に設定
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 静的サイトなのでリポジトリ直下をそのままアーティファクト化
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
